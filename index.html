    const av = avatarHtml({athlete_id:p.isMatch ? "match" : p.id, name:p.name, team:p.team, league:g.league, sport:g.sport,
      game:{home:g.home.abbr, away:g.away.abbr, home_logo:g.home.logo, away_logo:g.away.logo, home_color:g.home.color, away_color:g.away.color, home_name:g.home.short, away_name:g.away.short, sport:g.sport, demo:g.demo}});
    h += '<div class="sheethead">' + av + '<div class="grow"><div style="font-weight:750;font-size:19px;line-height:1.2">' + title + '</div><div class="subrow">' + sub.map(t => '<span>' + esc(t) + '</span>').join("") + '</div></div></div>';
  }
  h += '<div class="stabs" role="tablist" aria-label="Stat">' + x.list.map(q => '<button role="tab" aria-selected="' + (x.stat === q.key) + '" data-stat="' + esc(q.key) + '" class="' + (x.stat === q.key ? "on" : "") + '">' + esc(q.short) + '<small>' + (live ? "now " + fmt(curVal(p, q)) : statHint(p, q)) + '</small></button>').join("") + '</div>';
  x.chips = lineChips(x.market, pr);
  // the line and the side: under the graph on a player, so moving the line moves the bars
  let ctl = "";
  if (!pr.yesno){
    ctl += '<div class="linebox"><button class="iconbtn" id="lminus" aria-label="Line down">&minus;</button><input id="linein" type="number" inputmode="decimal" step="0.5" min="0" placeholder="No line" aria-label="Line" value="' + esc(x.line) + '"><button class="iconbtn" id="lplus" aria-label="Line up">+</button></div>';
    if (x.stat === "HCAP" || x.stat === "ACAP"){
      const cp = side => capText({stat:x.stat, side, line:parseFloat(x.line) || 0, sport:g.sport, game:{home_name:g.home.short || g.home.name, away_name:g.away.short || g.away.name}});
      ctl += '<div class="seg"><button class="more' + (x.side === "more" ? " on" : "") + '" data-side="more">' + esc(cp("more")) + '</button><button class="less' + (x.side === "less" ? " on" : "") + '" data-side="less">' + esc(cp("less")) + '</button></div>';
    } else ctl += '<div class="seg"><button class="more' + (x.side === "more" ? " on" : "") + '" data-side="more">More (over)</button><button class="less' + (x.side === "less" ? " on" : "") + '" data-side="less">Less (under)</button></div>';
  } else {
    ctl += '<div class="seg"><button class="more' + (x.side === "more" ? " on" : "") + '" data-side="more">Yes</button><button class="less' + (x.side === "less" ? " on" : "") + '" data-side="less">No</button></div>';
  }
  const chips = x.chips.length ? '<div class="label">' + ((gameLines() || {}).provider ? 'Lines from ' + esc(gameLines().provider) : 'Lines') + '</div><div class="lchips">' + x.chips.map((c, i) => '<button class="lchip' + (Math.abs(c.line - parseFloat(x.line)) < 1e-6 && c.side === x.side ? " on" : "") + '" data-lc="' + i + '">' + esc(c.label) + '<small>' + money(c.price) + '</small></button>').join("") + '</div>' + marketNote(x.market, pr)
    : (S.game && S.game.lines_note && !live ? '<div class="small muted" style="margin-top:10px">' + esc(S.game.lines_note) + '</div>' : '');
  if (cardOn){
    h += '<div class="cpanel"><div id="formbox">' + formInner(x, pr) + '</div><div class="cctl">' + ctl + '</div>' + (!pr.yesno ? '<div class="small muted cnote">Clear the line to just get alerts with no target.</div>' : '') + '</div>';
    h += chips;
    const l5 = last5Inner(x), mu = matchupInner(x, pr);
    h += '<div id="l5wrap"' + (l5 ? '' : ' hidden') + '><h4 class="sh">Last five</h4><div id="l5box">' + l5 + '</div></div>';
    h += '<div id="muwrap"' + (mu ? '' : ' hidden') + '><h4 class="sh">Matchup</h4><div id="mubox2" class="card mcard">' + mu + '</div></div>';
  } else {
    h += chips + '<div class="label">' + (pr.yesno ? esc(pr.name) : 'Line') + '</div>' + ctl + (!pr.yesno ? '<div class="small muted" style="margin-top:6px">Clear the line to just get alerts with no target.</div>' : '');
  }
  const subOk = FEAT().subs && g.sport === "soccer" && !p.isMatch && x.side === "more";
  if (subOk){
    if (x.subs == null) x.subs = ((S.state || {}).settings || {}).sub_on !== false;
    h += '<div class="label">Sub on, play on</div><div class="toggle"><div class="small muted">If he comes off, the bet moves to the player who replaces him</div><button class="switch' + (x.subs ? " on" : "") + '" id="ssub" aria-label="Sub on, play on"></button></div>';
  }
  if (!SETTLE[x.stat]) h += '<div class="label">Alerts</div><div class="seg"><button data-al="all" class="' + (x.alerts === "all" ? "on" : "") + '">' + (p.isMatch && g.sport === "basketball" ? "Every score" : "Every change") + '</button><button data-al="key" class="' + (x.alerts === "key" ? "on" : "") + '">Result only</button></div>';
  if (x.stat === "HCAP" || x.stat === "ACAP") h += '<div class="small muted" style="margin-top:8px">Settles on the final margin' + (g.sport === "tennis" ? " in games" : "") + '. You get one alert with the result.</div>';
  else if (!pr.mono && !pr.yesno && !SETTLE[x.stat]) h += '<div class="small muted" style="margin-top:8px">Yards can go back down on a loss, so this one stays open until full time.</div>';
  if (x.stat === "HWIN" || x.stat === "AWIN" || x.stat === "DRAW") h += '<div class="small muted" style="margin-top:8px">' + (g.sport === "soccer" ? "Settles on the score after 90 minutes." : g.sport === "tennis" ? "Settles on the result. If a player retires it still stands once a set is done." : "Settles on the final score.") + ' You get one alert with the result.</div>';
  else if (g.sport === "tennis") h += '<div class="small muted" style="margin-top:8px">If a player retires, this stands only if it was already decided. Otherwise it\'s void.</div>';
  h += '<div id="sheeterr" class="err" style="margin-top:10px"></div><div class="sheetbar"><button class="btn" id="scancel">Cancel</button><button class="btn primary grow" id="sadd">' + addLabel(x) + '</button></div>';
  $("sheetin").innerHTML = h;
  const fbx = $("formbox");
  if (fbx){
    fbx.onclick = e => {
      const r = e.target.closest("[data-rng]");
      if (r){
        if (r.dataset.rng === "opp") x.ff = "opp";
        else { x.n = +r.dataset.rng; if (x.ff === "opp") x.ff = "all"; }
        updateFormBox(); return;
      }
      const b = e.target.closest("[data-ff]"); if (!b) return;
      x.ff = b.dataset.ff; updateFormBox();
    };
    fbx.onchange = e => { if (e.target.id === "ffwo"){ x.wo = e.target.value; if (x.wo) loadForm(p, g, x.wo); else updateFormBox(); } };
  }
  const l5b = $("l5box");
  if (l5b) l5b.onclick = e => { const b = e.target.closest("[data-stat]"); if (!b) return; setStat(b.dataset.stat); renderSheet(); };
  const inp = $("linein");
  const relook = () => {
    x.odds = x.market ? priceAt(x.market, pr.yesno ? 0.5 : parseFloat(x.line), x.side) : null;
    $("sadd").textContent = addLabel(x);
    $("sheetin").querySelectorAll("[data-lc]").forEach(b => { const c = x.chips[+b.dataset.lc]; b.classList.toggle("on", Math.abs(c.line - parseFloat(x.line)) < 1e-6 && c.side === x.side); });
    updateFormBox();
    if (x.stat === "HCAP" || x.stat === "ACAP") renderSheetSides();
  };
  if (inp){
    inp.oninput = () => { x.line = inp.value; relook(); };
    const step = d => { let v = parseFloat(inp.value); if (isNaN(v)) v = pr.line; else v += d; if (v < 0) v = 0.5; inp.value = x.line = String(+v.toFixed(1)); relook(); };
    $("lminus").onclick = () => step(-1); $("lplus").onclick = () => step(1);
  }
  $("sheetin").querySelectorAll("[data-lc]").forEach(b => b.onclick = () => { const c = x.chips[+b.dataset.lc]; x.line = String(c.line); x.side = c.side; x.odds = c.price; renderSheet(); });
  $("sheetin").querySelectorAll(".stabs [data-stat]").forEach(b => b.onclick = () => { setStat(b.dataset.stat); renderSheet(); });
  $("sheetin").querySelectorAll("[data-side]").forEach(b => b.onclick = () => { x.side = b.dataset.side; x.odds = x.market ? priceAt(x.market, pr.yesno ? 0.5 : parseFloat(x.line), x.side) : null; renderSheet(); });
  $("sheetin").querySelectorAll("[data-al]").forEach(b => b.onclick = () => { x.alerts = b.dataset.al; renderSheet(); });
  const ss = $("ssub"); if (ss) ss.onclick = () => { x.subs = !x.subs; renderSheet(); };
  $("scancel").onclick = closeSheet;
  $("sadd").onclick = async () => {
    const raw = pr.yesno ? "0.5" : (inp ? inp.value.trim() : "");
    if (raw !== "" && (isNaN(parseFloat(raw)) || parseFloat(raw) < 0)) { $("sheeterr").textContent = "That line doesn't look right."; return; }
    $("sadd").disabled = true;
    const fb = sheetForm(x), streak = raw !== "" && fb && fb.games ? streakOf(fb.games, x.stat, parseFloat(raw), x.side !== "less") : 0;
    try{
      await api("/api/picks", {game_id:g.id, athlete_id:p.id, name:p.name, short:p.short, team:p.team, stat:x.stat, side:x.side, alerts:x.alerts, line: raw === "" ? null : parseFloat(raw), odds: x.odds || null, sub_on: subOk ? !!x.subs : undefined, streak: streak || undefined});
      LS.set("last-" + (g.sport || "basketball") + (p.isMatch ? "-m" : ""), {stat:x.stat, side:x.side});
      closeSheet(); await loadState(); renderGame();
      const what = (pr.yesno ? pr.name + ": " + (x.side === "more" ? "Yes" : "No") : (raw === "" ? pr.name : (x.side === "more" ? "More " : "Less ") + raw + " " + pr.name)) + (x.odds ? " @ " + money(x.odds) : "");
      toast({kind:"event", title:"Tracking " + (p.isMatch ? "the match" : p.name), body:what});
    }catch(e){ $("sheeterr").textContent = e.message; $("sadd").disabled = false; }
  };
}

function addLabel(x){ return "Add pick" + (x && x.odds ? " · " + money(x.odds) : ""); }
// Keep the line or handicap buttons in step with the line as it's typed.
function renderSheetSides(){
  const x = S.sheet; if (!x) return;
  const g = x.g, gm = {home_name:g.home.short || g.home.name, away_name:g.away.short || g.away.name};
  $("sheetin").querySelectorAll("[data-side]").forEach(b => { b.textContent = capText({stat:x.stat, side:b.dataset.side, line:parseFloat(x.line) || 0, sport:g.sport, game:gm}); });
}

/* ---------- loops ---------- */
loadState(); loadGames();
setInterval(loadState, 3000);
setInterval(() => { if (S.tab === "games" && !S.gameId && document.activeElement !== $("gsearch")) loadGames(); }, 20000);
setInterval(() => { if (S.gameId && !S.sheet && document.activeElement !== $("psearch")) refreshGame(); }, 10000);
setInterval(() => { if (S.state) setFeed(S.state.feed); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ loadState(); if (S.tab === "games") loadGames(); } });
</script>
<div id="othertab" style="display:none;position:fixed;inset:0;z-index:90;background:#090f1c;align-items:center;justify-content:center;padding:24px;text-align:center"><div style="max-width:340px"><div style="font-weight:700;font-size:18px;margin-bottom:8px">Overline is open in another tab</div><div style="color:#8d9ab2;font-size:15px">Use that one, or close it and this tab takes over.</div></div></div>
<script>
(function(){
  function start(){
    var s = document.createElement("script");
    s.src = "engine.js?v=5.2";
    s.onload = function(){ try { window.main([]); } catch (e) { window.__engineFailed(); } };
    s.onerror = function(){ window.__engineFailed(); };
    document.body.appendChild(s);
  }
  // One copy of the engine at a time, so two tabs don't save over each other's picks.
  function boot(){
    var forever = function(){ return new Promise(function(){}); };
    if (navigator.locks && navigator.locks.request) {
      navigator.locks.request("proptracker-engine", {ifAvailable: true}, function(lock){
        if (lock) { start(); return forever(); }
        document.getElementById("othertab").style.display = "flex";
        navigator.locks.request("proptracker-engine", function(){ document.getElementById("othertab").style.display = "none"; start(); return forever(); });
      });
    } else start();
  }

  // ---- Moving address ----
  // The site used to live on OLD. Anyone who opens the old address is sent to SITE with their saved
  // picks packed into the part of the link after #, which never leaves their browser. The new site
  // unpacks them before the engine starts, and the engine folds them in.
  var OLD = "alistairunie.github.io", SITE = "https://overlinestats.com/";
  var LEAVE = /^(pt:data\..*|photos-v1|pt:moveid|pt:moved-in)$/; // caches refill by themselves
  var zip = typeof CompressionStream === "function" && typeof DecompressionStream === "function";
  function b64u(bytes){
    var s = "";
    for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64u(t){
    t = t.replace(/-/g, "+").replace(/_/g, "/");
    while (t.length % 4) t += "=";
    var s = atob(t), b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  function pipe(bytes, stream){ return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function(a){ return new Uint8Array(a); }); }
  function newHost(){ try { return new URL(SITE).hostname; } catch (e) { return ""; } }
  function up(){
    // the new site answers before anyone is sent there; if it doesn't, the old one carries on as normal
    var t = new Promise(function(res){ setTimeout(function(){ res(false); }, 6000); });
    var f = fetch(SITE + "favicon.svg?up=" + Date.now(), {mode: "no-cors", cache: "no-store"}).then(function(){ return true; }, function(){ return false; });
    return Promise.race([f, t]);
  }
  function leave(){
    var id = localStorage.getItem("pt:moveid");
    if (!id) { id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); localStorage.setItem("pt:moveid", id); }
    var keep = {}, n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!LEAVE.test(k)) { keep[k] = localStorage.getItem(k); n++; }
    }
    var to = SITE + location.search;
    if (!n) { location.replace(to); return Promise.resolve(); }
    var raw = new TextEncoder().encode(JSON.stringify({v: 1, id: id, keep: keep}));
    return (zip ? pipe(raw, new CompressionStream("gzip")) : Promise.resolve(raw)).then(function(b){
      location.replace(to + (zip ? "#move=" : "#movej=") + b64u(b));
    });
  }
  function arrive(){
    var m = /^#move(j?)=([A-Za-z0-9_-]+)$/.exec(location.hash);
    if (!m) return Promise.resolve();
    // take the packed data out of the address bar and history straight away
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    var bytes = unb64u(m[2]);
    var text = m[1] ? Promise.resolve(bytes) : pipe(bytes, new DecompressionStream("gzip"));
    return text.then(function(b){
      var p = JSON.parse(new TextDecoder().decode(b));
      if (!p || !p.id || !p.keep) return;
      var seen = [];
      try { seen = JSON.parse(localStorage.getItem("pt:moved-in") || "[]") || []; } catch (e) {}
      if (seen.indexOf(p.id) >= 0) return; // came across already; the old copy is out of date now
      for (var k in p.keep) {
        if (!Object.prototype.hasOwnProperty.call(p.keep, k) || LEAVE.test(k)) continue;
        if (k === "pt:data") localStorage.setItem("pt:data.incoming", p.keep[k]);
        else if (localStorage.getItem(k) == null) localStorage.setItem(k, p.keep[k]);
      }
      seen.push(p.id);
      localStorage.setItem("pt:moved-in", JSON.stringify(seen.slice(-20)));
      window.__movedIn = true;
    });
  }
  var nh = newHost();
  if (location.hostname === OLD && nh && nh !== OLD) {
    up().then(function(ok){ if (ok) return leave(); boot(); }).catch(boot);
  } else {
    arrive().catch(function(){}).then(function(){
      boot();
      if (window.__movedIn) setTimeout(function(){
        if (typeof window.toast === "function") window.toast({kind: "event", title: "Your picks came across", body: "Overline has moved here. If you had the old address on your home screen, add this one instead."});
      }, 2500);
    });
  }
})();
</script>
