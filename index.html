  $("sbnext").onclick = () => { const ids = S.state.picks.filter(p => S.sel[p.id] && !p.final).map(p => p.id); if (ids.length) openSlipSheet(ids, null); };
}
function plainWhat(p){ return pickWhat(Object.assign({}, p, {odds:null})).replace(/<[^>]+>/g, "").trim(); }
function openSheetPanel(){ $("sheetbg").classList.add("show"); $("sheet").classList.add("show"); }
function openSlipSheet(ids, slip, focus){
  const picks = S.state.picks;
  const legs = slip ? slip.legs.map(l => ({pick:l.pick, label:(l.short || l.name) + " " + l.label, odds:l.odds, state:l.state || "", hand:!!l.void_hand, can:!!l.can_void, out:!!l.priced_out}))
                    : ids.map(id => { const p = picks.find(q => q.id === id) || {}; return {pick:id, label:(p.short || p.name) + " " + plainWhat(p), odds:p.odds, game:p.game_id}; });
  legs.forEach(l => { l.was = l.odds || null; });
  const prod = legs.length && legs.every(l => l.odds) ? legs.reduce((a, l) => a * l.odds, 1) : null;
  // a same game multi is priced by the bookie, so the total doesn't follow the legs
  const sgm = slip ? slip.kind === "sgm" : legs.length > 1 && new Set(legs.map(l => l.game)).size === 1;
  S.sheet = {slip:true};
  updateSlipBar();
  // legs the bookie voided, by your say-so (the app's own voids can't be undone here)
  const vset = new Set(slip ? legs.filter(l => l.hand).map(l => l.pick) : []);
  const vstart = [...vset].sort().join(",");
  const isVoid = l => vset.has(l.pick) || (!l.hand && (l.state === "void" || l.state === "push"));
  let h = '<div class="grab"></div><div style="font-weight:700;font-size:18px">' + (slip ? "Edit slip" : legs.length === 1 ? "New single" : "New " + legs.length + "-leg slip") + '</div>';
  h += '<div class="vlegs" id="vlegs"></div><div class="small muted" id="vhint" style="margin-top:6px"></div>';
  h += '<div class="label">Stake</div><div class="linebox"><span class="muted" style="font-size:22px">$</span><input id="sstake" type="number" inputmode="decimal" step="1" min="0.5" value="' + (slip ? slip.stake : LS.get("lastStake", 10)) + '"></div>';
  h += '<div class="label" id="splbl">Price</div><div class="linebox"><span class="muted" style="font-size:22px">$</span><input id="sprice" type="number" inputmode="decimal" step="0.01" min="1" placeholder="Price on your slip" value="' + (slip ? (+slip.price).toFixed(2) : prod ? (Math.round(prod * 100) / 100).toFixed(2) : "") + '"></div>';
  if (!slip && legs.length > 1) h += '<div class="small muted" style="margin-top:6px" id="prodnote">' + (prod && !sgm ? "That's the legs multiplied together. " : "") + 'Bookies price same game multis lower, so put in the price on your slip.</div>';
  h += '<div class="label">Name (optional)</div><input class="inp" id="sname" maxlength="40" placeholder="Saturday NBA multi" value="' + esc(slip ? slip.name : "") + '">';
  h += '<div class="small" id="sret" style="margin-top:10px"></div><div id="swarn" class="warn" style="margin-top:6px"></div><div id="sheeterr" class="err" style="margin-top:8px"></div>';
  h += '<div class="row" style="margin-top:14px;gap:8px"><button class="btn" id="scancel">Cancel</button><button class="btn primary grow" id="ssave">' + (slip ? "Save" : "Add slip") + '</button></div>';
  $("sheetin").innerHTML = h;
  const ret = () => {
    const s = parseFloat($("sstake").value), p = parseFloat($("sprice").value), ov = s > 0 ? overLimit(s, slip) : 0;
    const allVoid = slip && legs.every(isVoid);
    $("sret").textContent = allVoid ? "Every leg is void, so your stake comes back." : s > 0 && p > 1 ? "Returns " + money(s * p) + " if it lands" : "";
    $("swarn").textContent = ov > 0.004 ? "That takes you " + money(ov) + " past your " + money(S.state.weekly.limit) + " weekly limit." : "";
    if (S.sheet) S.sheet.okOver = false;
    $("ssave").textContent = slip ? "Save" : "Add slip";
  };
  // the legs multiplied, leaving out the void ones; null while one has no price
  const legProduct = () => {
    let x = 1;
    for (const l of legs){ if (isVoid(l)) continue; if (!(+l.odds > 1)) return null; x *= +l.odds; }
    return x;
  };
  const drawLegs = () => {
    $("vlegs").innerHTML = legs.map((l, i) => {
      const off = isVoid(l);
      const act = !slip ? '' : l.can ? '<button class="btn small" data-vleg="' + i + '">' + (vset.has(l.pick) ? "Put back" : "Void") + '</button>'
        : off ? '<span class="vtag">' + (l.state === "push" ? "Push" : "Void") + '</span>' : '';
      const px = '<span class="vpx"><span class="muted small">$</span><input data-vpx="' + i + '" type="number" inputmode="decimal" step="0.01" min="1.01" placeholder="Price" value="' + (+l.odds > 1 ? (+l.odds).toFixed(2) : "") + '"' + (off || l.out ? " disabled" : "") + ' aria-label="Price for this leg"></span>';
      return '<div class="vleg' + (off ? " off" : "") + '">' + (slip ? legMark(off ? "void" : l.state) : '') + '<div class="t">' + esc(l.label) + '</div>' + px + act + '</div>';
    }).join("");
    $("vlegs").querySelectorAll("[data-vpx]").forEach(inp => inp.oninput = () => {
      const l = legs[+inp.dataset.vpx], before = legProduct(), cur = parseFloat($("sprice").value), v = parseFloat(inp.value);
      l.odds = v > 1 ? v : null;
      // the total follows the legs while it's them multiplied (or empty), except on a same game multi
      const after = legProduct();
      if (!sgm && after && (!(cur > 1) || (before && Math.abs(cur - before) / before < 0.01))) $("sprice").value = (Math.round(after * 100) / 100).toFixed(2);
      ret();
    });
    $("vlegs").querySelectorAll("[data-vleg]").forEach(b => b.onclick = () => {
      const l = legs[+b.dataset.vleg], on = !vset.has(l.pick), p = parseFloat($("sprice").value);
      if (on) vset.add(l.pick); else vset.delete(l.pick);
      // a multi drops by the void leg's price, the way bookies work it out
      if (l.odds > 1 && p > 0) $("sprice").value = Math.max(1, Math.round((on ? p / l.odds : p * l.odds) * 100) / 100).toFixed(2);
      else if (on) S.sheet.noOdds = true;
      drawLegs(); ret();
    });
    if (!slip){
      $("vhint").textContent = legs.length > 1 ? "Each leg's price is optional. With them in, the app can take a void leg out of the price for you." : "";
      return;
    }
    const changed = [...vset].sort().join(",") !== vstart;
    $("splbl").textContent = legs.some(isVoid) ? "Price now" : "Price";
    $("vhint").textContent = changed || slip.price_check
      ? "A void leg comes out of the slip and your bookie works out a new price. Check it on your bookie's slip and type it in." + (S.sheet && S.sheet.noOdds ? " That leg had no price here, so the app can't work it out for you." : "")
      : legs.some(l => l.can) ? "Bookie voided a leg? Tap Void on it. You can put in or change each leg's price too." : "You can put in or change each leg's price.";
  };
  drawLegs();
  $("sstake").oninput = ret; $("sprice").oninput = ret; ret();
  $("scancel").onclick = () => { closeSheet(); updateSlipBar(); };
  $("ssave").onclick = async () => {
    const stake = parseFloat($("sstake").value), price = parseFloat($("sprice").value), name = $("sname").value.trim();
    const allVoid = slip && legs.every(isVoid);
    if (!(stake > 0)) { $("sheeterr").textContent = "Put in your stake."; return; }
    if (!allVoid && !(price >= (slip ? 1 : 1.01))) { $("sheeterr").textContent = "Put in the price on your slip."; return; }
    if (overLimit(stake, slip) > 0.004 && S.sheet && !S.sheet.okOver){ S.sheet.okOver = true; $("ssave").textContent = slip ? "Save anyway" : "Add anyway"; return; }
    // the legs whose price was typed in or changed
    const odds = {};
    legs.forEach(l => { if (!l.out && (+l.odds || 0) !== (+l.was || 0)) odds[l.pick] = +l.odds > 1 ? +l.odds : 0; });
    const typed = Object.keys(odds).length ? {odds} : {};
    $("ssave").disabled = true;
    try{
      if (slip) await api("/api/slips/update", Object.assign({id:slip.id, stake, name, void:[...vset]}, price >= 1 ? {price} : {}, typed));
      else { await api("/api/slips", Object.assign({legs:ids, stake, price, name}, typed)); LS.set("lastStake", stake); }
      closeSheet(); S.selecting = false; S.sel = {};
      await loadState();
      setPicksSeg("slips");
      const now = slip && (S.state.slips || []).find(x => x.id === slip.id);
      // a slip that settled just now gets its own alert
      if (!slip || (now && now.status === "open")) toast({kind:"event", title:slip ? "Slip saved" : "Slip added", body:"Returns " + money(stake * price) + " if it lands"});
    }catch(e){ $("sheeterr").textContent = e.message; $("ssave").disabled = false; }
  };
  openSheetPanel();
  if (focus === "price"){ const el = $("sprice"); el.focus(); el.select(); }
}

function openSettleSheet(s){

function slipKind(s){ return s.kind === "single" ? "Single" : s.kind === "sgm" ? "Same game multi" : s.legs.length + "-leg multi"; }
function slipName(s){ return s.name ? s.name : slipKind(s); }
const SLIP_STATUS = {open:"Open", won:"Landed", lost:"Lost", void:"Void", cashout:"Cashed out"};
function legMark(st, live){
  const k = st === "won" ? "won" : st === "lost" ? "lost" : (st === "void" || st === "push") ? "void" : live ? "live" : "open";
  return '<span class="lm ' + k + '">' + ({won:"&#10003;", lost:"&#10005;", void:"&minus;"}[k] || "") + '</span>';
}
// A slip reads like a bet ticket: what it is and its status, the money, a tear line, then the legs.
function slipCard(s){
  const t = s.tally || {}, open = s.status === "open", oneToGo = open && t.live === 1 && t.won > 0, held = open && s.price_check && !t.live;
  const bits = [];
  if (open){
    if (t.won) bits.push(t.won + " of " + s.legs.length + " landed");
    if (t.live) bits.push(oneToGo ? "one to go" : t.live + " to go");
    if (t.void) bits.push(t.void + " void");
  }
  const tally = bits.join(", ");
  const kind = s.name ? '<div class="small muted">' + esc(slipKind(s)) + '</div>' : '';
  let h = '<div class="card slip ' + esc(open ? "" : s.status) + '">';
  h += '<div class="row"><div class="grow"><div style="font-weight:700;font-size:16px">' + esc(slipName(s)) + (s.ladder ? ' <span class="badge ladder">Ladder</span>' : '') + '</div>' + kind + '</div>' +
       '<span class="chip ' + (open ? "open" : esc(s.status)) + '">' + esc(open ? (held ? "Price needed" : oneToGo ? "One to go" : "Open") : SLIP_STATUS[s.status] || s.status) + '</span></div>';
  const paid = s.status === "won" || s.status === "cashout";
  h += '<div class="money"><div><small>Stake</small><b>' + money(s.stake) + '</b></div><div><small>Price</small><b>' + (+s.price).toFixed(2) + '</b></div>' +
       (open ? '<div><small>Returns</small><b>' + money(s.returns) + '</b></div>'
        : paid ? '<div><small>Paid</small><b class="pos">' + money(s.ret) + '</b></div>'
        : s.status === "void" ? '<div><small>Back</small><b>' + money(s.stake) + '</b></div>' : '<div><small>Lost</small><b class="neg">' + money(s.stake) + '</b></div>') + '</div>';
  if (s.price_was && (open || paid)) h += '<div class="was">Placed at ' + (+s.price_was).toFixed(2) + ', now ' + (+s.price).toFixed(2) + ' with the void leg out.</div>';
  if (open && s.price_check) h += '<div class="reprice"><div class="grow">' + (held ? "It landed with a leg void. Type in the price your slip paid at and it settles." : "A leg went void. Check the new price on your bookie\'s slip and type it in.") + '</div><button class="btn small primary" data-sprice="' + esc(s.id) + '">Type it in</button></div>';
  if (tally) h += '<div class="tally" style="margin-top:8px">' + esc(tally[0].toUpperCase() + tally.slice(1)) + '</div>';
  if (open && s.chance != null){
    const c = +s.chance;
    h += '<div class="live"><div class="big"><b>' + (c > 0 && c < 0.01 ? "Under 1%" : pct(c)) + '</b> to land, worth about <b>' + money(s.worth) + '</b> now</div>' +
      (c > 0.02 && c < 0.98 ? '<div class="small muted" style="margin-top:3px">A cash out above ' + money(s.worth) + ' beats holding on, going by our numbers' + (s.chance_rough ? '. Rough until every game starts' : '') + '.</div>' : '') + '</div>';
  }
  h += '<div class="tear"></div>';
  s.legs.forEach(l => {
    const st = l.state || l.result || "", off = st === "void" || st === "push";
    h += '<div class="legrow' + (off ? " voided" : "") + '">' + legMark(st, open && !st && l.status === "live") + '<div class="grow"><div><span class="who" data-gopen="' + esc(l.game_id || "") + '" data-aid="' + esc(l.athlete_id || "") + '">' + esc((l.short || l.name) + " " + l.label) + '</span>' + (l.odds ? ' <span class="muted small">@ ' + (+l.odds).toFixed(2) + '</span>' : '') + (off ? '<span class="vtag">' + (st === "push" ? "Push" : "Void") + '</span>' : '') + '</div>' +
      (open && !st && l.progress ? '<div class="small muted">' + esc(l.progress + (l.chance != null && l.status === "live" ? " · " + pct(l.chance) : "")) + '</div>' : '') + '</div></div>';
  });
  const armed = S.armed === "s:" + s.id;
  h += '<div class="acts">';
  if (open && FEAT().check) h += '<button class="btn small" data-schk="' + esc(s.id) + '">Check</button>';
  if (open) h += '<button class="btn small" data-sedit="' + esc(s.id) + '">Edit</button><button class="btn small" data-sset="' + esc(s.id) + '">Settle</button>';
  h += '<button class="btn small' + (armed ? " danger" : "") + '" data-sdel="' + esc(s.id) + '">' + (armed ? "Tap again to delete" : "Delete") + '</button></div>';
  return h + '</div>';
}
function renderSlips(el, top){
  const slips = S.state.slips || [];
  const open = slips.filter(s => s.status === "open"), done = slips.filter(s => s.status !== "open");
  // open slips in the order their next leg starts
  const byId = {};
  (S.state.picks || []).forEach(p => { byId[p.id] = p; });
  const nextStart = s => {
    let t = 8.64e15;
    (s.legs || []).forEach(l => {
      if (["won", "lost", "void", "push"].includes(l.state)) return;
      const v = Date.parse(((byId[l.pick] || {}).game || {}).start || "");
      if (!isNaN(v) && v < t) t = v;
    });
    return t;
  };
  open.sort((a, b) => nextStart(a) - nextStart(b));
  let h = top + weekCard();
  if (!slips.length) h += '<div class="empty"><b>No slips yet</b>On the Picks tab, tap Make a slip and choose the legs you backed. The app follows the whole slip and tells you when it lands, or when it\'s one leg away.</div>';
  if (open.length) h += '<h2>Open</h2>' + open.map(slipCard).join("");
  if (done.length) h += '<h2>Settled lately</h2>' + done.map(slipCard).join("");
  el.innerHTML = h;
  bindSegs(el, "ks", setPicksSeg);
  const find = id => slips.find(s => s.id === id);
  el.querySelectorAll("[data-schk]").forEach(b => b.onclick = () => checkSlip(b.dataset.schk));
  el.querySelectorAll("[data-sedit]").forEach(b => b.onclick = () => openSlipSheet(null, find(b.dataset.sedit)));
  el.querySelectorAll("[data-sprice]").forEach(b => b.onclick = () => openSlipSheet(null, find(b.dataset.sprice), "price"));
  el.querySelectorAll("[data-sset]").forEach(b => b.onclick = () => openSettleSheet(find(b.dataset.sset)));
  el.querySelectorAll("[data-sdel]").forEach(b => b.onclick = async () => {
    const k = "s:" + b.dataset.sdel;
    if (S.armed !== k){ S.armed = k; clearTimeout(S.armTimer); S.armTimer = setTimeout(() => { S.armed = null; renderPicks(); }, 4000); renderPicks(); return; }
    S.armed = null; await api("/api/slips/delete", {id:b.dataset.sdel}); loadState();
  });
}

function feedPick(t){
  return {athlete_id:t.athlete_id, name:t.name, team:t.team, league:t.league, sport:t.sport,
    game:{home:t.home_abbr, away:t.away_abbr, home_logo:t.home_logo, away_logo:t.away_logo, home_color:t.home_color, away_color:t.away_color,
          home_name:t.home_name, away_name:t.away_name, sport:t.sport}};

// One row per bet: the same bet can be a best bet and a call, so keep the first by kind.
function feedList(){
  const F = S.feed, q = S.feedQ;
  if (!F) return [];
  const rank = {best:0, call:1, value:2}, seen = {}, out = [];
  (F.tips || []).slice().sort((a, b) => (rank[a.kind_tip] || 0) - (rank[b.kind_tip] || 0)).forEach(t => {
    const k = [t.game_id, t.athlete_id, t.stat, t.side, t.line].join("|");
    if (seen[k]) return;
    seen[k] = 1;
    if ((!q.sport || t.sport === q.sport) && (!q.kind || t.kind_tip === q.kind)) out.push(t);
  });
  const edge = t => t.price ? t.p * t.price - 1 : -9;
  // best picks: the chance, nudged by the value at the price (capped, so a long shot's big edge can't run away with it)
  const pick = t => t.p + 0.5 * (t.price ? Math.max(-0.15, Math.min(0.25, t.p * t.price - 1)) : -0.03);
  if (q.sort === "value") out.sort((a, b) => edge(b) - edge(a) || b.p - a.p);
  else if (q.sort === "soon") out.sort((a, b) => String(a.start).localeCompare(String(b.start)) || pick(b) - pick(a));
  else if (q.sort === "chance") out.sort((a, b) => b.p - a.p || edge(b) - edge(a));
  else out.sort((a, b) => pick(b) - pick(a));
  const floor = +q.min || 0, per = {};
  return out.filter(t => {
    if ((t.price || t.fair || 0) < floor - 1e-9) return false;
    per[t.game_id] = (per[t.game_id] || 0) + 1;
    return per[t.game_id] <= 3;
  });
}
function feedSports(){
  const out = [];

// The matchup grade on a tip: the row's border, and one line on why.
const TIER_NAME = {elite:"Elite", great:"Great", good:"Good", even:"Even", tough:"Tough"};

// small projections keep two places: 0.43 goals, not 0.4
const pjf = v => { v = +v || 0; return v < 3 ? String(+v.toFixed(2)) : fmt(v); };
// What a graded spot projects to, against the line where there is one.
function muProj(m, line){
  if (!m || m.proj == null) return "";
  if (m.chance != null) return "About a " + pct(m.chance) + " chance of one or more";
  const ln = parseFloat(line);
  if (isNaN(ln)) return "Projects " + pjf(m.proj);
  const gap = +(m.proj - ln).toFixed(1);
  return "Projects " + pjf(m.proj) + ", " + (gap === 0 ? "right on" : fmt(Math.abs(gap)) + (gap > 0 ? " over" : " under")) + " the line of " + fmt(ln);
}
function muLine(t){
  const m = t.mu;

    '<div class="rects">' + recTile("All time", all) + recTile("Last 30 days", E.d30) + recTile("Last 7 days", E.d7) + '</div>' +
    (H.great && H.great.all && H.great.all.n ? '<div class="small muted" style="margin-top:10px">Great spots: ' + pct(H.great.all.won / H.great.all.n) + ' (' + H.great.all.won + ' of ' + H.great.all.n + ')</div>' : '') + '</div>';
  // week by week, oldest first
  const W = H.weeks || [];
  h += '<h2>Week by week</h2><div class="card"><div class="wkbars">' + W.map(w => {
    const r = w.n ? w.won / w.n : null;
    return '<div class="wk' + (w.now ? " now" : "") + '"><span class="wv">' + (r == null ? "" : Math.round(r * 100) + "%") + '</span><span class="wa"><i style="height:' + (r == null ? 0 : Math.max(3, Math.round(r * 70))) + 'px" class="' + (r == null ? "" : r >= 0.6 ? "hot" : r < 0.45 ? "cold" : "") + '"></i></span>' +
      '<span class="wn">' + (w.n || "") + '</span><span class="wl">' + esc(w.label.split(" ")[0]) + '</span></div>';
  }).join("") + '<div class="wk50"></div></div><div class="small muted" style="display:flex;justify-content:space-between;margin-top:4px"><span>' + esc(W.length ? "Week of " + W[0].label : "") + '</span><span>This week</span></div>' +
    '<div class="small muted" style="margin-top:6px">The bar is the hit rate, the number under it how many spots. The dashed line is 50%.</div></div>';
  if ((H.leagues || []).length) h += '<h2>By league</h2><div class="card">' + recRows(H.leagues, "short") + '</div>';
  if ((H.stats || []).length) h += '<h2>By stat</h2><div class="card">' + recRows(H.stats, "name") + '</div>';
  const M = H.marks || {};
  if ((M.line && M.line.n) || (M.avg && M.avg.n)) h += '<h2>By mark</h2><div class="card">' + recRows([Object.assign({name:"Bookie's line"}, M.line || {n:0, won:0}), Object.assign({name:"His average"}, M.avg || {n:0, won:0})].filter(x => x.n), "name") + '</div>';
  const rec = H.recent || [];
  if (rec.length) h += '<h2>Latest</h2><div class="card">' + rec.map(x => '<div class="murr"><span class="res ' + esc(x.result) + '">' + (x.result === "won" ? "Hit" : x.result === "lost" ? "Miss" : "Void") + '</span>' +
    '<span class="grow" style="min-width:0">' + esc((x.short || x.name) + " " + (x.yes ? x.stat_name : "over " + fmt(x.mark) + " " + x.stat_name.toLowerCase())) + ' <span class="muted small">' + esc(TIER_NAME[x.tier] + ", " + x.game) + '</span></span>' +
    '<span class="v">' + (x.v == null ? "-" : fmt(x.v)) + '</span></div>').join("") + '</div>';
  h += '<div class="card small muted" style="margin-top:12px">Each player\'s best spot in a game counts once, saved before the start and marked after it. The mark is the bookie\'s line where there was one, otherwise the x.5 just under his average.</div>';
  el.innerHTML = h;
  bindMu(el);
}

function renderMatchups(el){
  const view = S.muView || "today";
  if (view === "today") return renderMuToday(el);
  if (view === "record") return renderMuRecord(el);
  const top = playsTop() + muViewSegs(), R = S.mu, q = S.muQ;
  if (!S.muLoading && !S.muErr && (!R || (!R.building && Date.now() - (S.muAt || 0) > 10 * 60e3))) loadMatchups();
  let h = top;
  if (!R){
    el.innerHTML = h + (S.muErr ? '<div class="empty"><b>Couldn\'t load matchups</b>' + esc(S.muErr) + '</div><button class="btn block" id="muretry">Try again</button>' : '<div class="spin"></div>');
    bindMu(el);
    const rt = $("muretry"); if (rt) rt.onclick = () => { S.muErr = ""; loadMatchups(); renderLadder(); };
    return;
  }
  if (R.none){
    el.innerHTML = h + '<div class="empty"><b>No matchups to read</b>' + esc(R.none) + '</div>';
    bindMu(el);
    return;
  }
  if (R.leagues.length > 1) h += '<div class="fchips">' + R.leagues.map(l => '<button data-mul="' + esc(l.key) + '" class="' + (R.league === l.key ? "on" : "") + '">' + esc(l.short) + ' <span style="opacity:.6">' + l.games + '</span></button>').join("") + '</div>';
  // the team view always shows one position and one stat: the ones picked, or the first
  const teams = q.view === "teams" && R.table;
  const pos = teams && !q.pos ? R.table.bucket : q.pos, prop = teams && !q.prop ? R.table.stat : q.prop;
  const bk = (R.buckets || []).find(b => b.key === pos);
  const props = (R.props || []).filter(p => !bk || bk.props.includes(p.key));
  h += '<div class="filters"><select id="mu_view">' + fopt("spots", "Best spots", q.view) + fopt("teams", "Every team", q.view) + '</select>' +
    '<select id="mu_pos">' + (teams ? "" : fopt("", "All positions", pos)) + (R.buckets || []).map(b => fopt(b.key, b.name[0].toUpperCase() + b.name.slice(1), pos)).join("") + '</select>' +
    '<select id="mu_prop">' + (teams ? "" : fopt("", "All stats", prop)) + props.map(p => fopt(p.key, p.name, prop)).join("") + '</select></div>';
  if (R.building){
    const lshort = ((R.leagues || []).find(l => l.key === R.league) || {}).short || R.league.toUpperCase();
    h += readingHtml({done:R.done || 0, total:R.total || 0}, "Reading box scores: ") + '<div class="empty" style="padding-top:6px">The first read of ' + esc(lshort) + ' takes a minute. After that only new games are read.</div>';
  } else {
    h += muKey();
    if (q.view === "teams" && R.table) h += muTable(R.table);
    else {
      const spots = R.spots || [];
      S.muList = spots;
      if (spots.length) h += '<div class="list">' + spots.map((x, i) => muRow(x, i)).join("") + '</div>';
      else h += '<div class="empty"><b>Nothing stands out</b>' + (q.prop || q.pos ? "Try all stats or all positions." : "No player has a soft spot in this slate.") + '</div>';
    }
    h += '<div class="card small muted" style="margin-top:12px">From the last ' + Math.round(R.days / 7) + ' weeks of box scores (' + R.games_read + ' games). A defence\'s number is what players at that position put up against it, a game. A player\'s rank is his own average at his position' +
      (R.sport === "soccer" ? ", from his starts" : "") + '. Elite means both are near the top. The big number is the projection: his average, moved by how much this defence gives up. Green line means he projects over it. Tap one to pick a line.</div>';
  }
  el.innerHTML = h;
  bindMu(el);
  const save = () => { LS.set("muQ", S.muQ); loadMatchups(); renderLadder(); };
  el.querySelectorAll("[data-mul]").forEach(b => b.onclick = () => { S.muQ.league = b.dataset.mul; S.muQ.prop = ""; S.muQ.pos = ""; S.mu = null; save(); });
  const vw = $("mu_view"); if (vw) vw.onchange = () => { S.muQ.view = vw.value; save(); };
  const ps = $("mu_pos"); if (ps) ps.onchange = () => { S.muQ.pos = ps.value; const b = (R.buckets || []).find(x => x.key === ps.value); if (b && S.muQ.prop && !b.props.includes(S.muQ.prop)) S.muQ.prop = ""; save(); };
  const pr = $("mu_prop"); if (pr) pr.onchange = () => { S.muQ.prop = pr.value; save(); };
  el.querySelectorAll("[data-mu]").forEach(r => r.onclick = () => { const x = (S.muList || [])[+r.dataset.mu]; if (x) openMatchup(x); });
}
// Opens the game on that player with the stat ready to pick a line.
async function openMatchup(x){
  await openPlayerGame(x.game_id, x.athlete_id);
  if (S.gameId !== x.game_id || !S.game) return;
  for (const tm of S.game.teams){ const p = tm.players.find(q => String(q.id) === String(x.athlete_id)); if (p) return openSheet(p, S.game.game, x.stat); }
}

/* the multi builder: one leg a game, picked for the best chance at the price you want */
async function loadMulti(){
  if (S.multiLoading){ S.multiAgain = true; return; }
  S.multiLoading = true; S.multiErr = "";
  const q = S.mQ, want = JSON.stringify(q);
  if (S.tab === "ladder" && S.playsSeg === "multi") renderLadder();
  try{ S.multi = await api("/api/multi?legs=" + q.legs + "&target=" + q.target + (q.sport ? "&sport=" + encodeURIComponent(q.sport) : "")); S.multiFor = want; S.multiAt = Date.now(); }
  catch(e){ S.multiErr = e.message; }
  S.multiLoading = false;
  if (S.multiAgain){ S.multiAgain = false; return loadMulti(); }
  if (S.tab === "ladder" && S.playsSeg === "multi") renderLadder();
}
function multiLeg(l){
  const own = l.athlete_id === "match" || l.label.indexOf(l.name) === 0;
  return '<div class="leg"><div class="l1"><span>' + (own ? esc(l.label) : esc(l.name) + (l.team ? ' <span class="muted small">' + esc(l.team) + '</span>' : '') + injBadge(l.injury)) + '</span>' +
    '<span class="price">' + (l.price ? money(l.price) : 'fair ' + money(l.fair)) + '</span></div>' +
    (own ? '' : '<div class="l2">' + esc(l.label) + '</div>') +
    '<div class="l3">' + esc(feedGame(l)) + (l.book && l.price ? ' · ' + esc(l.book) : '') + '</div>' +
    '<div class="why">' + pct(l.p) + ' chance' + (l.why ? ' · ' + esc(l.why) : '') + '</div></div>';
}
function multiText(M){
  return "🎯 **" + M.legs.length + "-leg multi @ $" + (+M.price).toFixed(2) + "** (" + pct(M.p) + " chance all land)\n" +
    M.legs.map(l => "• " + (l.athlete_id === "match" || l.label.indexOf(l.name) === 0 ? "" : "**" + l.name + "** ") + l.label +
      (l.price ? " @ $" + (+l.price).toFixed(2) + (l.book ? " " + l.book : "") : "") + " (" + (l.away_abbr || l.away_name) + " @ " + (l.home_abbr || l.home_name) + ")").join("\n") +
    "\n_Chances are estimates, not locks. Bet what you can afford._";
}
function renderMulti(el){
  const top = playsTop(), q = S.mQ, F = S.feed, M = S.multi;
  if (!S.feedLoading && !S.feedErr && (!F || (!F.building && Date.now() - (S.feedAt || 0) > 10 * 60e3))) loadFeed(false);
  else if (F && !F.building && !S.multiLoading && !S.multiErr && (!M || S.multiFor !== JSON.stringify(q))) loadMulti();
  S.feedDrawn = feedSig();
  let h = top + '<div class="small muted" style="margin:-4px 2px 10px">Each leg comes from a different game, so one result doesn\'t drag the others down. The legs are the likeliest mix that gets to your price.</div>';
  h += '<div class="fchips">' + [2, 3, 4, 5, 6].map(n => '<button data-ml="' + n + '" class="' + (+q.legs === n ? "on" : "") + '">' + n + ' legs</button>').join("") + '</div>';
  const sports = feedSports();
  h += '<div class="filters"><span class="row small muted" style="gap:6px">Price at least $<input id="m_target" type="number" step="0.5" min="1.5" max="100" inputmode="decimal" value="' + (+q.target).toFixed(2) + '"></span>' +
    (sports.length > 1 || q.sport ? '<select id="m_sport">' + fopt("", "All sports", q.sport) + sports.map(sp => fopt(sp, SPORT_NAME(sp), q.sport)).join("") + '</select>' : '') + '</div>';
  if (!F || F.building){
    h += F ? readingHtml(F, "Reading the games first: ") : S.feedErr ? '<div class="empty"><b>Couldn\'t read the games</b>' + esc(S.feedErr) + '</div><button class="btn block" id="mretry">Try again</button>' : '<div class="spin"></div>';
  } else if (!M || S.multiFor !== JSON.stringify(q)){
    h += S.multiErr ? '<div class="empty"><b>Couldn\'t build it</b>' + esc(S.multiErr) + '</div><button class="btn block" id="mretry">Try again</button>' : '<div class="spin"></div>';
  } else if (M.none){
    h += '<div class="empty"><b>No multi to show</b>' + esc(M.none) + '</div>';
  } else {
    const done = M.legs.every(legTracked), fair = M.legs.some(l => !l.price);
    h += '<div class="card play"><div class="top"><div><span class="badge best">' + M.legs.length + '-leg multi</span><div class="kind">At <span class="price" style="color:var(--text)">' + money(M.price) + '</span> · fair ' + money(M.fair) + '</div></div>' +
      '<div class="chance">' + pct(M.p) + '<small>all land</small></div></div>' + M.legs.map(multiLeg).join("") +
      '<div class="row" style="gap:7px;margin-top:8px;flex-wrap:wrap"><button class="btn small' + (done ? '' : ' primary') + '" id="mtrack"' + (done ? " disabled" : "") + '>' + (done ? "Tracking all legs" : "Track all " + M.legs.length + " legs") + '</button>' +
      (HOOK() ? '<button class="btn small" id="mpost">Post</button>' : '') + '<button class="btn small" id="mref">Read the games again</button></div></div>';
    h += '<div class="small muted" style="margin:0 2px 12px">' + (fair ? "A leg without a price is counted at its fair price. " : "The price is the legs multiplied. ") + 'Bookies sometimes pay a little less on multis, so go by the price on your slip.</div>';
  }
  h += '<div class="card small muted">' + esc(pricesNote()) + '</div>';
  el.innerHTML = h;
  bindSegs(el, "ps", setPlaysSeg);
  const upd = (k, v) => { S.mQ[k] = v; LS.set("mQ", S.mQ); S.multi = null; S.multiErr = ""; if (S.feed && !S.feed.building) loadMulti(); else renderLadder(); };
  el.querySelectorAll("[data-ml]").forEach(b => b.onclick = () => upd("legs", +b.dataset.ml));
  const tg = $("m_target"); if (tg) tg.onchange = () => { const v = parseFloat(tg.value); if (v >= 1.5 && v <= 100) upd("target", Math.round(v * 100) / 100); else tg.value = (+S.mQ.target).toFixed(2); };
  const sp = $("m_sport"); if (sp) sp.onchange = () => upd("sport", sp.value);
  const rt = $("mretry"); if (rt) rt.onclick = () => { S.feedErr = ""; S.multiErr = ""; if (!S.feed || S.feed.building) loadFeed(true); else loadMulti(); renderLadder(); };
  const rf = $("mref"); if (rf) rf.onclick = () => { S.multi = null; loadFeed(true); renderLadder(); };
  const mp = $("mpost"); if (mp) mp.onclick = () => postDiscord({text:multiText(M)}, mp);
  const mt = $("mtrack");
  if (mt) mt.onclick = async () => {
    mt.disabled = true; mt.textContent = "Adding...";
    const ids = [];
    for (const l of M.legs){
      const have = S.state && S.state.picks.find(p => !p.final && p.game_id === l.game_id && p.athlete_id === l.athlete_id && p.stat === l.stat && p.side === l.side && Math.abs((+p.line || 0) - (+l.line || 0)) < 1e-6);
      if (have){ ids.push(have.id); continue; }
      const pk = await trackTip(l, null);
      if (pk) ids.push(pk.id);
    }
    await loadState();
    renderLadder();
    if (FEAT().slips && ids.length === M.legs.length) openSlipSheet(ids, null);
    else toast({kind:"event", title:"Tracking the multi", body:ids.length + " legs added"});
  };
}

/* the record: every tip saved before its game and marked after, so you can see if the chances hold up */
async function loadScore(){
  if (S.scoreLoading) return;
  S.scoreLoading = true;
  try{ S.score = await api("/api/scorecard?days=" + S.scoreQ.days + "&sport=" + encodeURIComponent(S.scoreQ.sport || "all")); S.scoreErr = ""; }
  catch(e){ S.scoreErr = e.message; }
  S.scoreLoading = false;
  if (S.sheet && S.sheet.record) renderRecord();
  else if (S.tab === "ladder" && S.playsSeg === "tips" && !busyTyping()) renderLadder();
}
function scoreTotal(R){
  return (R.kinds || []).filter(k => k.key !== "sgm").reduce((a, k) => ({n:a.n + k.n, won:a.won + k.won, priced:a.priced + k.priced, units:a.units + k.units}), {n:0, won:0, priced:0, units:0});
}
function recordCard(){
  const R = S.score;
  if (!R || !R.ok) return "";
  const t = scoreTotal(R);
  if (!t.n && !R.pending) return "";
  const one = S.scoreQ.sport && S.scoreQ.sport !== "all";
  return '<div class="card record" id="fdrec" role="button" tabindex="0"><div class="grow"><div class="small muted">' + esc(one ? SPORT_NAME(S.scoreQ.sport) + " tips" : "How the tips went") + ', last ' + R.days + ' days</div>' +
    (t.n ? '<div class="rline"><span class="big2">' + t.won + ' of ' + t.n + '</span><span class="small muted">landed, ' + pct(t.won / t.n) + '</span></div>' + (R.pending ? '<div class="small muted">' + R.pending + ' more waiting on results</div>' : '')
         : '<div style="font-weight:650;margin-top:3px">The first results come in as games finish</div><div class="small muted">' + R.pending + (R.pending === 1 ? " tip" : " tips") + ' waiting on results</div>') +
    '</div><span class="chev" aria-hidden="true">&rsaquo;</span></div>';
}
function openRecord(){
  S.sheet = {record:true};
  renderRecord();
  openSheetPanel();
  loadScore();
}
function unitsText(u){ return (u >= 0 ? "+" : "") + (+u).toFixed(2); }
function renderRecord(){
  if (!S.sheet || !S.sheet.record) return;
  const R = S.score, q = S.scoreQ;
  let h = '<div class="grab"></div><div style="font-weight:700;font-size:18px">How the tips went</div>' +
    '<div class="small muted" style="margin-top:2px">Every tip is saved before its game starts and marked when it finishes.</div>';
  h += '<div class="fchips" style="margin-top:12px">' + [7, 30, 90].map(d => '<button data-rd="' + d + '" class="' + (+q.days === d ? "on" : "") + '">Last ' + d + ' days</button>').join("") + '</div>';
  if (!R || S.scoreLoading && !R.ok){
    h += S.scoreErr ? '<div class="err">' + esc(S.scoreErr) + '</div>' : '<div class="spin"></div>';
  } else {
    const sports = (R.sports || []).map(x => x.key);
    if (q.sport && q.sport !== "all" && !sports.includes(q.sport)) sports.push(q.sport);
    if (sports.length > 1 || (q.sport && q.sport !== "all")) h += '<div class="filters"><select id="rsport">' + fopt("all", "All sports", q.sport || "all") + sports.map(sp => fopt(sp, SPORT_NAME(sp), q.sport)).join("") + '</select></div>';
    const t = scoreTotal(R), kinds = R.kinds || [];
    if (!t.n && !kinds.length){
      h += '<div class="empty" style="padding:22px 8px"><b>Nothing marked yet</b>' + (R.pending ? R.pending + (R.pending === 1 ? " tip is" : " tips are") + " waiting on their games to finish." : "Tips get saved when you open the Tips feed or a game's tips, then marked once the game is over.") + '</div>';
    } else {
      const said = kinds.filter(k => k.key !== "sgm").reduce((a, k) => a + k.n * k.said, 0) / Math.max(1, t.n);
      h += '<div class="statgrid" style="margin-top:4px"><div><small>Landed</small><span class="big2">' + t.won + '/' + t.n + '</span></div><div><small>Hit rate</small><span class="big2">' + pct(t.n ? t.won / t.n : 0) + '</span><small>we said ' + pct(said) + '</small></div>' +
        '<div><small>$1 on each</small><span class="big2 ' + (t.units >= 0 ? "pos" : "neg") + '">' + (t.priced ? smoney(t.units) : "-") + '</span></div></div>';
      h += '<table class="mk" style="margin-top:12px"><tr><th>Kind</th><th>Tips</th><th>Landed</th><th>Units</th></tr>' +
        kinds.map(k => '<tr><td>' + esc(KIND_NAME[k.key] || k.key) + '<small>We said ' + pct(k.said) + ' on average</small></td><td>' + k.n + '</td><td>' + pct(k.rate) + '</td><td class="' + (k.units >= 0 ? "pos" : "neg") + '">' + (k.priced ? unitsText(k.units) : "-") + '</td></tr>').join("") + '</table>';
      if ((R.sports || []).length > 1) h += '<table class="mk" style="margin-top:12px"><tr><th>Sport</th><th>Tips</th><th>Landed</th><th>Units</th></tr>' +
        R.sports.map(k => '<tr><td>' + esc(SPORT_NAME(k.key)) + '</td><td>' + k.n + '</td><td>' + pct(k.rate) + '</td><td class="' + (k.units >= 0 ? "pos" : "neg") + '">' + (k.priced ? unitsText(k.units) : "-") + '</td></tr>').join("") + '</table>';
      if ((R.buckets || []).length){
        h += '<h3 style="margin-top:18px">Do the chances hold up?</h3><div class="small muted" style="margin:-2px 2px 8px">The bar is how often they landed. The line is the chance we gave them.</div>';
        h += R.buckets.map(b => '<div class="recbar"><span>' + esc(b.range) + '</span><div class="track"><i style="width:' + Math.round(b.landed * 100) + '%;background:' + (b.landed + 0.05 >= b.said ? "var(--green)" : "var(--amber)") + '"></i><b style="left:' + Math.round(b.said * 100) + '%"></b></div>' +
          '<span class="n">' + pct(b.landed) + '<small>' + b.n + ' tips</small></span></div>').join("");
      }
      const rec = (R.recent || []).slice(0, 25);
      if (rec.length) h += '<h3 style="margin-top:18px">Latest results</h3><div class="reclist">' + rec.map(x => '<div class="legrow">' + legMark(x.result) + '<div class="grow"><div>' +
        esc(x.kind === "sgm" ? x.label : (x.name && x.label.indexOf(x.name) !== 0 ? x.name + " " : "") + x.label) + (x.price ? ' <span class="muted small">@ ' + (+x.price).toFixed(2) + '</span>' : '') + '</div>' +
        '<div class="small muted">' + esc(x.game) + ' · ' + esc(new Date(x.start).toLocaleDateString("en-AU", {day:"numeric", month:"short"})) + ' · we said ' + pct(x.p) + '</div></div></div>').join("") + '</div>';
    }
    if (R.pending && (t.n || kinds.length)) h += '<div class="small muted" style="margin-top:10px">' + R.pending + ' more waiting on results.</div>';
  }
  h += '<button class="btn block" id="rclose" style="margin-top:14px">Close</button>';
  $("sheetin").innerHTML = h;
  $("sheetin").querySelectorAll("[data-rd]").forEach(b => b.onclick = () => { S.scoreQ.days = +b.dataset.rd; LS.set("scoreQ", S.scoreQ); S.score = null; renderRecord(); loadScore(); });
  const rs = $("rsport"); if (rs) rs.onchange = () => { S.scoreQ.sport = rs.value; LS.set("scoreQ", S.scoreQ); S.score = null; renderRecord(); loadScore(); };
  $("rclose").onclick = closeSheet;
}

/* this week's spending, and the limit if you set one */
function weekCard(){
  const W = S.state && S.state.weekly;
  if (!W || !FEAT().weekly) return "";
  const lim = +W.limit || 0, last = W.last || {};

const VERDICT = {good:["Good value", "good"], fair:["Fair price", "fair"], poor:["Poor value", "poor"], strong:["Good pick", "good"], even:["Coin flip", "fair"],
  long:["Long shot", "poor"], out:["Ruled out", "poor"], won:["Landed", "good"], lost:["Missed", "poor"], "void":["Void", "fair"], unknown:["Can't rate", "none"]};

function chkFresh(){ return {phase:"start", legs:[], res:null, price:"", stake:"", err:"", lines:[], scan:null}; }
async function checkImages(files){
  const job = S.chk = Object.assign(chkFresh(), {phase:"reading", total:files.length, done:0, pct:0});
  renderLadder();
  const alive = () => S.chk === job;
  try{
    OCR.log = m => { if (alive() && m.status === "recognizing text"){ job.pct = m.progress || 0; chkProgress(); } };
    const w = await ocrWorker();
    const blobs = [];
    for (let i = 0; i < files.length; i++){
      if (!alive()) return;
      job.done = i; job.pct = 0; chkProgress();
      const blob = typeof files[i] === "string" ? await (await fetch(files[i])).blob() : files[i];
      blobs.push(blob);
      const r = await w.recognize(await prepImage(blob));
      if (i) job.lines.push("---");
      r.data.text.split("\n").forEach(l => job.lines.push(l));
    }
    if (!alive()) return;
    job.phase = "matching"; renderLadder();
    let res = await api("/api/scan", {lines:job.lines});
    if (!res.legs.length && alive()){
      job.phase = "reading"; job.again = true; renderLadder();
      const more = [];
      for (let i = 0; i < blobs.length; i++){
        const r = await w.recognize(await prepImage(blobs[i], true));
        more.push("---");
        r.data.text.split("\n").forEach(l => more.push(l));
      }
      const res2 = await api("/api/scan", {lines:job.lines.concat(more)});
      if (res2.legs.length){ res = res2; job.lines = job.lines.concat(more); }
    }
    ocrIdle();
    if (!alive()) return;
    job.scan = res;
    job.legs = res.legs.map(l => Object.assign({}, l));
    job.price = res.price != null ? res.price : "";
    job.stake = res.stake != null ? res.stake : "";
    job.bookie = res.bookie || "";
    if (!job.legs.length){ job.phase = "error"; job.err = res.note || "Couldn't find any bets in that picture."; renderLadder(); return; }
    await runCheck(job);
  }catch(e){
    if (!alive()) return;
    job.phase = "error"; job.err = e.message || String(e); renderLadder();
  }
}
function chkReady(l){ return l.stat && (l.line != null && l.line !== "" || l.yesno || l.stat === "HWIN" || l.stat === "AWIN" || l.stat === "DRAW"); }
async function runCheck(job){

  if (!legs.length){ job.phase = "fix"; renderLadder(); return; }
  try{
    job.res = await api("/api/check", {legs, price:parseFloat(job.price) || 0, stake:parseFloat(job.stake) || 0});
    // the rated legs line up with the ready ones: carry each one's typed price across
    (job.res.legs || []).forEach((l, i) => { if (legs[i] && legs[i].odds > 1) l.odds = legs[i].odds; });

      '<div class="small" id="chksumtxt" style="margin-top:10px;line-height:1.45">' + esc(chkSummary(R, price, v)) + '</div>';
    if (R.weakest && R.weakest.without > R.p) h += '<div class="small muted" style="margin-top:8px">Weakest leg: ' + esc((R.weakest.name && !/ v /.test(R.weakest.name) ? R.weakest.name + " " : "") + R.weakest.label) + ' at ' + pct(R.weakest.p) + '. Without it the chance goes from ' + pct(R.p) + ' to ' + pct(R.weakest.without) + '.</div>';

  // a leg's price: its value and verdict move at once, and so does the whole bet's price while it's the legs multiplied
  el.querySelectorAll("[data-ckpx]").forEach(inp => inp.oninput = () => {
    const R = j.res, i = +inp.dataset.ckpx, rl = R && R.legs[i];

    const ready = j.legs.filter(chkReady), before = chkLegProduct(j);
    const v = parseFloat(inp.value);
    rl.odds = v > 1 ? v : null;
    if (ready[i]) ready[i].odds = rl.odds;
    const lv = chkLegValue(rl), ev = $("ckev" + i);
    if (ev){ ev.textContent = lv.ev == null ? "-" : evText(lv.ev); ev.className = lv.ev == null ? "" : lv.ev >= 0 ? "pos" : "neg"; }
    const vc = $("ckv" + i); if (vc) vc.innerHTML = vchip(lv.verdict);
    const bl = $("ckbest" + i); if (bl) bl.innerHTML = chkBestLine(rl);
    // a single's price is the leg's; a multi's follows the legs while it was them multiplied (or empty); a same game multi's never does
    const cur = parseFloat(j.price), after = chkLegProduct(j), pi = $("chkprice");
    if (R.kind === "single" && rl.odds){
      j.price = rl.odds;
      if (pi){ pi.value = (+rl.odds).toFixed(2); pi.oninput(true); }
    } else if (R.kind !== "sgm" && after && (!(cur > 1) || (before && Math.abs(cur - before) / before < 0.01))){
      j.price = +after.toFixed(2);
      if (pi){ pi.value = j.price.toFixed(2); pi.oninput(true); }
    }
  });
  on("chktrack", async () => {
    const legs = j.legs.filter(chkReady);
    const b = $("chktrack"); b.disabled = true; b.textContent = "Adding...";
    try{
      const stake = parseFloat(j.stake), price = parseFloat(j.price);
      const r = await api("/api/scan/add", {legs:legs.map(l => ({game_id:l.game_id, athlete_id:l.athlete_id, name:l.name, team:l.team, stat:l.stat, side:l.side, line:l.line, odds:l.odds})),
        slip:stake > 0, stake:stake > 0 ? stake : 0, price:price >= 1.01 ? price : 0, bookie:j.bookie || "", name:j.bookie ? j.bookie + " slip" : ""});
      await loadState();

      toast({kind:"event", title:"Tracking " + r.picks + (r.picks === 1 ? " pick" : " picks") + (r.slip ? " on a slip" : ""), body:r.slip ? "" : "Add your stake on the Slips tab to follow it as a bet"});
      renderLadder();
    }catch(e){ b.disabled = false; b.textContent = "Try again"; toast({kind:"bust", title:"Couldn't add it", body:e.message}); }
  });
}
function chkSummary(R, price, v){
  if (R.p == null) return R.summary || "Couldn't rate this one.";
  if (v.verdict === "won") return "This one's already landed.";
  if (v.verdict === "lost") return "A leg has already missed, so this one's gone.";
  const n = R.legs.length, what = n === 1 ? "This bet lands" : "All " + n + " legs land";
  let s = what + " about " + pct(R.p) + " of the time, so the fair price is " + money(R.fair) + ".";
  if (price > 1){
    const ev = v.ev;
    s += " At " + money(price) + (ev >= 0.05 ? " that's good value, about " + Math.round(ev * 100) + "% better than fair." : ev >= 0 ? " that's about fair." : ev >= -0.08 ? " that's a little under fair, which is normal for a bookie's price." : " that's poor value, about " + Math.round(-ev * 100) + "% worse than fair.");
  } else s += " Put in the price on your slip to see if it's good value.";
  return s;
}

/* ---------- game extras ---------- */
function periodText(g, p){
  if (!p) return "";
  if (g.sport === "soccer") return p === 1 ? "1H" : p === 2 ? "2H" : "ET";
  if (g.sport === "league") return p === 1 ? "1H" : p === 2 ? "2H" : "GP";
  if (g.sport === "hockey") return p <= 3 ? "P" + p : "OT";
  return p <= 4 ? "Q" + p : "OT";
}
function wpChart(g){
  const wp = S.game.winprob;
  if (!wp || wp.length < 3) return "";
  const W = 320, H = 110, n = wp.length;
  const pts = wp.map((v, i) => (i / (n - 1) * W).toFixed(1) + "," + (3 + (1 - v) * (H - 6)).toFixed(1)).join(" ");
  const last = wp[n - 1], lead = last >= 0.5 ? g.home : g.away, lp = last >= 0.5 ? last : 1 - last;
  return '<h2 id="wph">Win chance</h2><div class="card"><div class="row"><div class="grow small muted">ESPN\'s model after each play</div><b>' + esc(lead.abbr) + ' ' + pct(lp) + '</b></div>' +
    '<svg class="wp" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><line x1="0" x2="' + W + '" y1="' + (H / 2) + '" y2="' + (H / 2) + '" stroke="rgba(148,170,210,.24)" stroke-width="1" stroke-dasharray="4 4"/>' +
    '<polyline fill="none" stroke="#5ca8ff" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="' + pts + '"/></svg>' +
    '<div class="small muted" style="display:flex;justify-content:space-between"><span>Higher: ' + esc(g.home.abbr) + '</span><span>Lower: ' + esc(g.away.abbr) + '</span></div></div>';
}
function pbpHtml(g){
  // Substitutions are mostly noise here, so they're left out.
  const pl = (S.game.plays || []).filter(x => !/ enters the game\b/i.test(x.text || ""));
  if (!pl.length) return "";

}

/* ---------- pick sheet extras ---------- */
function teammates(x){
  if (!S.game || x.p.isMatch) return [];
  const t = S.game.teams.find(tm => tm.players.some(p => p.id === x.p.id));
  if (!t) return [];
  const L = (gameLines() || {}).players || {};
  // Teammates ruled out tonight come first: "without him" matters most when he's missing.
  const weight = p => (/^out/i.test(p.inj || "") ? 100000 : 0) + ((p.stats && +p.stats.MIN) || 0) * 100 + (L[p.id] ? Object.keys(L[p.id]).length : 0) + (p.starter ? 50 : 0);
  return t.players.filter(p => p.id !== x.p.id && !p.dnp).sort((a, b) => weight(b) - weight(a) || a.name.localeCompare(b.name)).slice(0, 14);
}
function formKey(x){ return x.g.id + "|" + x.p.id + (x.ff === "without" && x.wo ? "|" + x.wo : ""); }
function formFilters(x, f){
  if (!FEAT().screener || !f || !f.games || !f.games.length) return "";
  const mates = teammates(x);
  const list = [["all", "All"], ["home", "Home"], ["away", "Away"]];
  if (f.opp) list.push(["opp", "vs " + f.opp]);
  let h = '<div class="fchips">' + list.map(([k, l]) => '<button data-ff="' + k + '" class="' + ((x.ff || "all") === k ? "on" : "") + '">' + esc(l) + '</button>').join("") +
    (mates.length ? '<button data-ff="without" class="' + (x.ff === "without" ? "on" : "") + '">Without a teammate</button>' : '') + '</div>';
  if (x.ff === "without" && mates.length) h += '<select id="ffwo" style="width:100%;margin-bottom:8px"><option value="">Which teammate?</option>' + mates.map(m => '<option value="' + esc(m.id) + '"' + (x.wo === m.id ? " selected" : "") + '>' + esc(m.name) + (/^out/i.test(m.inj || "") ? " (out tonight)" : "") + '</option>').join("") + '</select>';
  return h;
}
function marketNote(m, pr){
  if (!m || !FEAT().screener) return "";
  const bits = [];
  if (!pr.yesno && m.over && m.under){
    const po = 1 / m.over, pu = 1 / m.under;
    bits.push("Fair price " + money((po + pu) / po) + " over, " + money((po + pu) / pu) + " under, with the margin out");
  }
  if (m.open_line != null) bits.push("Line opened at " + fmt(m.open_line));
  else if (m.open_over) bits.push((pr.yesno ? "Opened at " : "Over opened at ") + money(m.open_over));
  return bits.length ? '<div class="small muted" style="margin-top:2px">' + esc(bits.join(" · ")) + '</div>' : "";
}

/* ---------- add bets from a screenshot ---------- */
// The text is read on this device by Tesseract (bundled in ocr/), so screenshots never leave the phone.
const OCR = {worker:null, loading:null, idle:null, log:null};
const SIMD_TEST = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]);
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load the screenshot reader")); document.head.appendChild(s); });
}
async function blobUrl(url, type){
  const r = await fetch(url);
  if (!r.ok) throw new Error("Couldn't load the screenshot reader");
  return URL.createObjectURL(new Blob([await r.arrayBuffer()], {type}));
}
function ocrWorker(){

    let simd = false;

    const workerPath = await blobUrl("ocr/worker.min.js", "application/javascript");
    const corePath = (await blobUrl("ocr/" + (simd ? "tesseract-core-simd-lstm.wasm.js" : "tesseract-core-lstm.wasm.js"), "application/javascript")) + "#core.js";
    const r = await fetch("ocr/eng.traineddata.gz");

/**
 * Grey, with every dark band flipped to dark-on-light (dark mode, coloured headers, dark cards on a
 * light page), which is what the reader handles best. strong: bigger and black and white, for a
 * second go when the first read found nothing.
 */
async function prepImage(blob, strong){
  const bmp = await createImageBitmap(blob);
  let scale = bmp.width < 1000 ? Math.min(2, 1300 / bmp.width) : bmp.width > 2000 ? 2000 / bmp.width : 1;
  if (strong) scale *= 1.5;
  if (bmp.width * bmp.height * scale * scale > 16e6) scale = Math.sqrt(16e6 / (bmp.width * bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
  const x = c.getContext("2d", {willReadFrequently:true});
  x.imageSmoothingQuality = "high";
  x.drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  const W = c.width, H = c.height, im = x.getImageData(0, 0, W, H), d = im.data;
  const rows = new Float64Array(H + 1);
  for (let y = 0; y < H; y++){
    let s = 0;
    for (let i = y * W * 4, e = i + W * 4; i < e; i += 4){ const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = g; s += g; }
    rows[y + 1] = rows[y] + s / W;
  }
  // a band is dark when the rows around it are, so a line of light text inside a dark card flips with its card
  const R = Math.max(4, Math.round(H / 250));
  const hist = new Float64Array(256);
  for (let y = 0; y < H; y++){
    const a = Math.max(0, y - R), b = Math.min(H, y + R + 1), dark = (rows[b] - rows[a]) / (b - a) < 118;
    for (let i = y * W * 4, e = i + W * 4; i < e; i += 4){ const g = dark ? 255 - d[i] : d[i]; d[i] = d[i + 1] = d[i + 2] = g; hist[g | 0]++; }
  }
  if (strong){
    // black and white at the split that best separates ink from page (Otsu)
    let total = W * H, sum = 0, sb = 0, wb = 0, best = 0, cut = 128;
    for (let t = 0; t < 256; t++) sum += t * hist[t];
    for (let t = 0; t < 256; t++){
      wb += hist[t]; if (!wb) continue;
      const wf = total - wb; if (!wf) break;
      sb += t * hist[t];
      const mb = sb / wb, mf = (sum - sb) / wf, v = wb * wf * (mb - mf) * (mb - mf);
      if (v > best){ best = v; cut = t; }
    }
    for (let i = 0; i < d.length; i += 4){ const g = d[i] > cut ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = g; }
  }
  x.putImageData(im, 0, 0);

}

async function scanImages(srcs){
  if (!S.sheet || !S.sheet.scan) openScan(true);
  const job = S.scan = {phase:"reading", total:srcs.length, done:0, pct:0, lines:[], loadingReader:!OCR.worker};
  renderScan();
  const alive = () => S.scan === job && S.sheet && S.sheet.scan;
  try{
    OCR.log = m => { if (!alive()) return; if (m.status === "recognizing text"){ job.loadingReader = false; job.pct = m.progress || 0; scanProgress(); } };
    const w = await ocrWorker();
    job.loadingReader = false;
    const blobs = [];
    for (let i = 0; i < srcs.length; i++){
      if (!alive()) return;
      job.done = i; job.pct = 0; scanProgress();
      const blob = typeof srcs[i] === "string" ? await (await fetch(srcs[i])).blob() : srcs[i];
      blobs.push(blob);
      const r = await w.recognize(await prepImage(blob));
      if (i) job.lines.push("---");
      r.data.text.split("\n").forEach(l => job.lines.push(l));
    }
    if (!alive()) return;
    job.phase = "matching"; renderScan();
    let res = await api("/api/scan", {lines:job.lines});
    if (!alive()) return;
    if (!res.legs.length){
      // nothing matched: read it again bigger and in black and white, and try with both reads
      job.phase = "reading"; job.again = true; renderScan();
      const more = [];
      for (let i = 0; i < blobs.length; i++){
        if (!alive()) return;
        job.done = i; job.pct = 0; scanProgress();
        const r = await w.recognize(await prepImage(blobs[i], true));
        more.push("---");
        r.data.text.split("\n").forEach(l => more.push(l));
      }
      if (!alive()) return;
      job.phase = "matching"; renderScan();
      const res2 = await api("/api/scan", {lines:job.lines.concat(more)});
      if (!alive()) return;
      if (res2.legs.length){ res = res2; job.lines = job.lines.concat(more); }
    }
    ocrIdle();
    job.res = res;
    job.legs = res.legs.map(l => Object.assign({}, l, {on: !l.tracked && !!l.stat && l.line != null}));
    job.stake = res.stake != null ? res.stake : "";
    job.price = res.price != null ? res.price : (res.legs.length && res.legs.every(l => l.odds) ? +res.legs.reduce((a, l) => a * l.odds, 1).toFixed(2) : "");
    job.slip = res.stake != null || res.legs.length > 1;
    job.phase = "review";
    renderScan();
  }catch(e){
    if (!alive()) return;
    job.phase = "error"; job.err = e.message || String(e); renderScan();
  }
}

// The graph: each game a bar against the line, newest on the right, minutes as a line across the top.
function chartSvg(games, key, line, more, sport){
  const n = games.length;
  if (!n) return "";
  const scroll = n > 20, W = scroll ? 14 + n * 20 : 340, H = 200, top = 16, bot = n > 10 ? 26 : 38, ch = H - top - bot;
  const vals = games.map(gm => +gm.v[key] || 0), hasLine = !isNaN(line);
  const max = Math.max(1, ...vals, hasLine ? line * 1.2 : 0) * 1.08;
  const gap = n > 14 ? 3 : n > 8 ? 5 : 8, x0 = 6, bw = (W - x0 * 2 - gap * (n - 1)) / n;
  const y = v => top + ch - Math.min(v, max) / max * ch;
  const mins = games.map(gm => gm.min == null ? null : +gm.min);
  const showMin = (sport === "basketball" || sport === "soccer") && mins.filter(v => v != null).length >= Math.max(2, n * 0.6);
  const mMax = sport === "soccer" ? 95 : Math.max(40, ...mins.filter(v => v != null)) * 1.05;
  let s = '<svg class="chart' + (n > 8 ? " dense" : "") + '" viewBox="0 0 ' + W + ' ' + H + '"' + (scroll ? ' width="' + W + '" height="' + H + '"' : '') + ' role="img" aria-label="Last ' + n + ' games against the line">';
  [0.5, 1].forEach(f => { s += '<line class="grid" x1="0" x2="' + W + '" y1="' + (top + ch * (1 - f)).toFixed(1) + '" y2="' + (top + ch * (1 - f)).toFixed(1) + '"/>'; });
  games.forEach((gm, i) => {
    const v = vals[i], cx = x0 + i * (bw + gap);
    const hit = hasLine ? (more ? v > line : v < line) : null;
    const cls = hit == null ? "n" : hit ? "h" : "m";
    const hgt = Math.max(v > 0 ? 6 : 4, ch * Math.min(v, max) / max), yy = top + ch - hgt;
    s += '<rect class="b ' + cls + (gm.prev ? " prev" : "") + '" x="' + cx.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hgt.toFixed(1) + '" rx="' + Math.min(6, bw / 3).toFixed(1) + '"/>';
    const inside = hgt >= 22 && bw >= 14;
    s += '<text class="bv ' + cls + (inside ? " in" : "") + '" x="' + (cx + bw / 2).toFixed(1) + '" y="' + (inside ? top + ch - 7 : yy - 5).toFixed(1) + '">' + esc(fmt(v)) + '</text>';
    const d = new Date(gm.date), opp = (gm.at === "@" ? "@" : "") + (gm.opp || "");
    s += '<text class="xo" x="' + (cx + bw / 2).toFixed(1) + '" y="' + (top + ch + 14) + '">' + esc(n > 14 ? (gm.opp || "") : opp) + '</text>';
    if (n <= 10 && !isNaN(d)) s += '<text class="xd" x="' + (cx + bw / 2).toFixed(1) + '" y="' + (top + ch + 28) + '">' + d.getDate() + "/" + (d.getMonth() + 1) + '</text>';
  });
  if (showMin){
    const pts = [];
    games.forEach((gm, i) => { if (mins[i] == null) return; pts.push([x0 + i * (bw + gap) + bw / 2, top + 4 + (ch - 4) * (1 - Math.min(mins[i], mMax) / mMax)]); });
    s += '<polyline class="mins" points="' + pts.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ") + '"/>';
    pts.forEach(q => { s += '<circle class="mind" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2.4"/>'; });
  }
  if (hasLine){
    const ly = y(line).toFixed(1), lab = fmt(line), lw = 12 + lab.length * 7;
    s += '<line class="ln" x1="0" x2="' + W + '" y1="' + ly + '" y2="' + ly + '"/>';
    s += '<rect class="lnc" x="2" y="' + (ly - 10) + '" width="' + lw + '" height="20" rx="10"/><text class="lnt" x="' + (2 + lw / 2) + '" y="' + (+ly + 4.5) + '">' + esc(lab) + '</text>';
  }
  return s + '</svg>' + (showMin || hasLine ? '<div class="ckey">' + (hasLine ? '<span class="k-ln">Line</span>' : '') + (showMin ? '<span class="k-min">Minutes</span>' : '') + '</div>' : '');
}

// Hit rate over the last 5, 10, 20, the season and against tonight's side. Tap one to graph it.
function rangeTiles(x, base, pr, line, more, hasLine){
  const key = pr.key, all = (base.games || []).filter(gm => gm.v[key] != null);
  const vs = all.filter(gm => gm.opp === base.opp).concat((base.vs_prev || []).filter(gm => gm.v[key] != null));
  const cur = x.ff === "opp" ? "opp" : String(x.n == null ? 10 : x.n);
  const tile = (gs, label, id) => {
    let b = "–", sm = "", cls = "";
    if (gs.length){
      const v = gs.map(gm => +gm.v[key]);
      if (!hasLine){ b = fmt(+(v.reduce((t, q) => t + q, 0) / v.length).toFixed(1)); sm = "avg"; }
      else {
        const h = v.filter(q => more ? q > line : q < line).length, r = h / v.length;
        b = h + "/" + v.length; sm = pct(r); cls = r >= 0.7 ? " hot" : r >= 0.55 ? " warm" : r < 0.4 ? " cold" : "";
      }
    }
    return '<button class="rt' + cls + (cur === id ? " on" : "") + (gs.length ? "" : " none") + '" data-rng="' + id + '"' + (gs.length ? "" : " disabled") + '><span>' + esc(label) + '</span><b>' + esc(b) + '</b><small>' + esc(sm) + '</small></button>';
  };
  const ts = [tile(all.slice(0, 5), "L5", "5"), tile(all.slice(0, 10), "L10", "10"), tile(all.slice(0, 20), "L20", "20")];
  if (base.season) ts.push(tile(all, "Season", "0"));
  if (base.opp) ts.push(tile(vs, "v " + base.opp, "opp"));
  return '<div class="rtiles n' + ts.length + '">' + ts.join("") + '</div>';
}

function formInner(x, pr){
  const base = sheetForm(x);
  if (!base || base.loading) return '<div class="cload"><div class="spin"></div>Reading his recent games</div>';
  if (base.error || !base.games || !base.games.length) return '<div class="small muted">No recent games to go on.</div>';
  const top = formFilters(x, base);
  const line = parseFloat(x.line), more = x.side !== "less", hasLine = !isNaN(line), key = pr.key;
  const tiles = rangeTiles(x, base, pr, line, more, hasLine);
  const ff = x.ff || "all";
  let games = base.games, tag = "";
  if (ff === "home"){ games = games.filter(gm => gm.at === "v"); tag = " at home"; }
  else if (ff === "away"){ games = games.filter(gm => gm.at === "@"); tag = " away"; }
  else if (ff === "opp"){ games = games.filter(gm => gm.opp === base.opp).concat(base.vs_prev || []); tag = " v " + base.opp; }
  else if (ff === "without"){
    if (!x.wo) return tiles + top + '<div class="small muted">Pick the teammate to leave out.</div>';
    const fw = S.forms[formKey(x)];
    if (!fw || fw.loading) return tiles + top + '<div class="small muted">Checking which games they missed...</div>';
    if (fw.error || !fw.games) return tiles + top + '<div class="small muted">Couldn\'t check that teammate.</div>';
    games = fw.games.filter(gm => gm.tm === false);
    if (!games.length) return tiles + top + '<div class="small muted">' + esc(fw.without_name || "They") + ' played in all of the last ' + fw.games.length + ' games, so there\'s nothing to compare yet.</div>';
    tag = " without " + String(fw.without_name || "them").split(" ").slice(-1)[0];
  }
  games = games.filter(gm => gm.v[key] != null);
  if (!games.length) return tiles + top + '<div class="small muted">' + (ff === "all" ? "No recent numbers for this stat." : "None of the last " + base.games.length + " games fit that.") + '</div>';
  const n = ff === "opp" || ff === "without" ? games.length : (x.n == null ? 10 : x.n) || games.length;
  const shown = games.slice(0, n);
  const vals = shown.map(gm => +gm.v[key]);
  const avg = vals.reduce((t, v) => t + v, 0) / vals.length;
  const mins = shown.map(gm => gm.min).filter(v => v != null);
  const hits = hasLine ? vals.filter(v => more ? v > line : v < line).length : null;
  const streak = streakOf(games, key, line, more);
  const what = (ff === "all" ? (n >= games.length && base.season ? "this season" : "last " + shown.length) : shown.length + (shown.length === 1 ? " game" : " games") + tag);
  const sum = '<div class="csum"><div><b>' + fmt(+avg.toFixed(1)) + '</b><span>Average</span></div>' +
    (hits != null ? '<div><b class="' + (hits / vals.length >= 0.6 ? "pos" : hits / vals.length < 0.4 ? "neg" : "") + '">' + pct(hits / vals.length) + '</b><span>Hit ' + hits + ' of ' + vals.length + '</span></div>' : '') +
    (mins.length ? '<div><b>' + fmt(Math.round(mins.reduce((t, v) => t + v, 0) / mins.length)) + '</b><span>Minutes</span></div>' : '') +
    '<div>' + (streak >= STREAK_MIN ? flameHtml(streak, "sum") : '<b>' + streak + '</b>') + '<span>In a row</span></div></div>';
  return tiles + top + sum + '<div class="cwrap' + (shown.length > 20 ? " scroll" : "") + '">' + chartSvg(shown.slice().reverse(), key, hasLine ? line : NaN, more, x.g.sport) + '</div>' +
    '<div class="cwhat">' + esc(what.charAt(0).toUpperCase() + what.slice(1)) + ', oldest to newest</div>';
}

// Hit rate tiles: last 5, last 10, the season and against tonight's side (this season and last). Averages when there's no line.
function hitTiles(base, pr, line, more, hasLine){
  const all = (base.games || []).filter(gm => gm.v[pr.key] != null), key = pr.key;
  const vs = all.filter(gm => gm.opp === base.opp).concat((base.vs_prev || []).filter(gm => gm.v[key] != null));
  const tile = (gs, label) => {
    if (!gs.length) return '<div class="hr none"><b>-</b><span>' + esc(label) + '</span></div>';
    const v = gs.map(gm => gm.v[key]);
    if (!hasLine) return '<div class="hr"><b>' + fmt(+(v.reduce((t, x) => t + x, 0) / v.length).toFixed(1)) + '</b><span>' + esc(label) + '</span></div>';
    const h = v.filter(x => more ? x > line : x < line).length, r = h / v.length;
    return '<div class="hr ' + (r >= 0.7 ? "hot" : r >= 0.55 ? "warm" : r < 0.4 ? "cold" : "") + '"><b>' + h + '/' + v.length + '</b><span>' + esc(label) + '</span></div>';
  };
  if (!all.length) return "";
  const ts = [tile(all.slice(0, 5), "Last 5"), tile(all.slice(0, 10), "Last 10")];
  if (base.season && all.length > 10) ts.push(tile(all, "Season"));

  const note = base.vs_prev && base.vs_prev.length ? '<div class="small muted" style="margin:-4px 0 8px">*v ' + esc(base.opp) + ' takes in last season' + (base.prev_season ? " (" + esc(base.prev_season) + ")" : "") + ' too.</div>' : '';
  return '<div class="hrt' + (ts.length < 4 ? " n" + ts.length : "") + '">' + ts.join("") + '</div>' + note;
}
// The games as bars against the line, each with its number and who it was against (or the date, when it's one opponent).
function hitBars(games, key, line, more, byDate){
  const n = games.length;

  const vals = games.map(gm => +gm.v[key] || 0);
  const H = 64, max = Math.max(1, ...vals, isNaN(line) ? 0 : line * 1.15);
  let s = '<div class="hbars">';
  games.forEach((gm, i) => {
    const v = vals[i], h = Math.max(2, Math.round(v / max * H));
    const cls = isNaN(line) ? "" : (more ? v > line : v < line) ? " hit" : " miss";
    const d = new Date(gm.date);
    const lab = byDate ? (isNaN(d) ? "" : d.getDate() + "/" + (d.getMonth() + 1)) : (gm.at === "@" ? "@" : "") + (gm.opp || "");
    s += '<div class="hb' + cls + (gm.prev ? " prev" : "") + '"><span class="hv">' + fmt(v) + '</span><span class="ha"><i style="height:' + h + 'px"></i></span><span class="ho">' + esc(lab) + '</span></div>';
  });
  if (!isNaN(line)) s += '<div class="hl" style="top:' + (15 + H - Math.round(Math.min(line, max) / max * H)) + 'px"></div>';
  return s + '</div><div class="small muted" style="display:flex;justify-content:space-between"><span>' + (n > 1 ? "Oldest" : "") + '</span><span>Most recent</span></div>';

/* ---------- pick sheet ---------- */
function openSheet(p, g, stat){
  const sport = g.sport || "basketball";

  const last = LS.get("last-" + sport + (p.isMatch ? "-m" : ""), {});

  S.sheet = {p, g, list, stat:st, side:last.side || "more", alerts:null, line:null, odds:null, market:null, chips:[], ff:"all", wo:"", n:10};

function setStat(k){
  const x = S.sheet, pr = x.list.find(q => q.key === k) || x.list[0];
  x.stat = pr.key; x.line = String(pr.line); x.alerts = pr.alerts || "all";
  if (pr.yesno && x.side !== "less") x.side = "more";
  const m = marketFor(x.p.id, pr.key);

    if (m.line != null) x.line = String(m.line);

    }
  }
  x.odds = m ? priceAt(m, pr.yesno ? 0.5 : parseFloat(x.line), x.side) : null;
}
function statHint(p, q){
