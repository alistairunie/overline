<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Overline</title>
<style>
@font-face{font-family:"Big Shoulders";src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Big Shoulders";src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Big Shoulders";src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree-latin-wght-normal.woff2) format("woff2");font-weight:300 900;font-display:swap}
/*
  Floodlit navy, a scoreboard face for every live number, orange only for your own actions.
  Colour means status: green landed, red bust, amber live or at risk, blue finished.
*/
:root{
  --bg:#0c1424;--card:#141e33;--card2:#1c2843;--sunk:#0f1829;
  --line:rgba(148,170,210,.13);--line2:rgba(148,170,210,.24);
  --text:#eef3fa;--muted:#8d9ab2;--faint:#5d6a83;
  --accent:#ff7a1a;--accent2:#ff9d57;--green:#2fe08a;--red:#ff4d63;--amber:#ffc53d;--blue:#5ca8ff;
  --num:"Big Shoulders","Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;--r2:16px;--r3:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,[data-game]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 104px)}

/* top bar: the tab's name, set big, and the feed status */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
#ptitle{margin:0;font:800 34px/0.95 var(--num);letter-spacing:.005em;white-space:nowrap}
.brandmark{width:17.8px;height:28px;flex:none;margin-bottom:2px}
.pill{font-size:12px;padding:5px 10px 5px 9px;border-radius:999px;background:var(--card);color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap;margin-bottom:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,224,138,.16)}
.dot.bad{background:var(--red);box-shadow:0 0 0 3px rgba(255,77,99,.16)}

h2{font:700 17px/1.25 var(--ui);color:var(--text);margin:24px 2px 10px;letter-spacing:0}
h3{font:600 13.5px/1.3 var(--ui);color:var(--muted);margin:16px 2px 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;font:650 12px/1 var(--ui);padding:5px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.live{background:rgba(255,197,61,.13);color:var(--amber)}
.badge.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1.6s ease-in-out infinite}
.badge.demo{background:rgba(92,168,255,.14);color:var(--blue)}
.badge.lg{background:transparent;color:var(--faint);padding:5px 2px}
.badge.ladder{background:rgba(47,224,138,.13);color:var(--green)}
.badge.best{background:rgba(255,122,26,.15);color:var(--accent2)}
.badge.inj{background:rgba(255,77,99,.14);color:var(--red)}
.badge.q{background:rgba(255,197,61,.13);color:var(--amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* grouped lists: one surface, rows divided, instead of a box per item */
.list{background:var(--card);border-radius:var(--r2);overflow:hidden;margin-bottom:10px}
.list > .card{background:transparent;border-radius:0;margin:0}
.list > .card + .card{border-top:1px solid var(--line)}

/* games */
.game{padding:12px 16px;cursor:pointer}
.game .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.game .meta .l{display:flex;gap:6px;align-items:center;min-width:0}
.game .meta .r{font-size:12.5px;color:var(--accent2);font-weight:650}
.game .team{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:15.5px}
.game .team .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.game .team.lead .name,.game.pre .team .name{color:var(--text);font-weight:600}
.game .team .score{font:800 24px/1 var(--num);font-variant-numeric:tabular-nums;min-width:30px;text-align:right;color:var(--muted)}
.game .team.lead .score{color:var(--text)}
.game .team .set{font:700 19px/1 var(--num);width:17px;text-align:center;color:var(--faint)}
.game .team .set.w{color:var(--text)}
.game .team .set.now{color:var(--amber)}
.rk{font:600 11px var(--ui);color:var(--faint);margin-left:5px}
.tlogo{width:24px;height:24px;border-radius:50%;flex:none;position:relative;display:inline-flex;align-items:center;justify-content:center;background:var(--tc,var(--card2));overflow:hidden}
.tlogo .mono{font:800 9px/1 var(--ui);color:#fff}
.tlogo img{position:absolute;left:1px;top:1px;width:calc(100% - 2px);height:calc(100% - 2px);object-fit:contain}
.tlogo.pic{background:transparent}
.tlogo.pic .mono,.tlogo.flag .mono{visibility:hidden}
.tlogo.flag{width:24px;height:16px;border-radius:4px;background:var(--card2)}
.tlogo.flag img{left:-8%;top:-39%;width:112%;height:173%;max-width:none;object-fit:fill}
/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;background:var(--card2);font-weight:650;color:var(--text)}
.btn.primary{background:var(--accent);color:#1d0c00}
.btn.block{width:100%}
.btn.small{padding:8px 13px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.45}
.iconbtn{width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);flex:none;color:var(--muted)}
.linkbtn{color:var(--accent2);font-weight:650;font-size:13px;padding:0 0 0 8px}
.search,.inp{width:100%;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid transparent;margin-bottom:8px}
.inp{background:var(--sunk);margin-bottom:0}
.search::placeholder,.inp::placeholder{color:var(--faint)}
.search:focus,.inp:focus{border-color:var(--line2);outline:none}
select{background:var(--card2);border:0;border-radius:12px;padding:9px 12px}
.err{color:var(--red);font-size:13px}
a{color:var(--accent2);font-weight:650}

/* bottom bar: a floating dock */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);z-index:20;background:linear-gradient(to top,var(--bg) 62%,rgba(12,20,36,0))}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(23,34,58,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(3,7,16,.55)}
nav.tabs .in.five{grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;color:var(--muted);font-size:11px;font-weight:650;position:relative;border-radius:18px}
nav.tabs button.on{color:var(--text);background:rgba(238,243,250,.07)}
nav.tabs button.on svg{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.count{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:#1d0c00;font-size:10.5px;line-height:17px;font-weight:800}

.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-weight:650;font-size:13.5px;color:var(--muted)}
.chip-btn.on{background:var(--text);color:var(--bg)}
.chip-btn .n{font-size:11px;color:var(--amber);margin-left:5px}
.chip-btn.on .n{color:#a35a00}

/* picks: the number is the hero, the track shows where the line sits */
.pick{position:relative;padding:14px 16px 12px}
.pick .head{display:flex;align-items:center;gap:12px;padding-right:30px}
.av{position:relative;width:44px;height:44px;flex:none}
.av .face{position:absolute;inset:0;border-radius:50%;background:var(--tc,var(--card2));overflow:hidden;display:flex;align-items:center;justify-content:center}
.av .mono{font:800 15px/1 var(--ui);color:#fff;letter-spacing:.01em}
.av.img .mono{visibility:hidden}
.av .face img{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);max-width:none}
.av .tm{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--card2);overflow:hidden;box-shadow:0 0 0 2px var(--card)}
.av .tm img{position:absolute;left:2px;top:2px;width:16px;height:16px;object-fit:contain}
.av .tm.flag img,.av.pair .tlogo.flag img{left:-36.5%;top:-39%;width:173%;height:173%;max-width:none;object-fit:fill}
.av.pair .tlogo{position:absolute;width:30px;height:30px;top:0;left:0;box-shadow:0 0 0 2px var(--card);background:var(--tc,var(--card2))}
.av.pair .tlogo.pic{background:var(--card2)}
.av.pair .tlogo + .tlogo{top:14px;left:14px}
.av.pair .tlogo.flag{border-radius:50%}
.av.pair .tlogo .mono{font-size:11px}
.pick .who{font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .who .small{font-weight:500}
.pick .what{color:var(--muted);font-size:13.5px;margin-top:2px}
.pick .what .price{color:var(--text)}
.pick .subl{font-size:12.5px;color:var(--blue);margin-top:3px}
.pick .head[data-gopen]{cursor:pointer}
.player.focus{background:rgba(255,138,61,.14);border-radius:12px;transition:background .8s}
.pick .foot .linkbtn.subon{color:var(--blue)}
.numrow{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
.pick .val{font:800 48px/.86 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.pick .of{font:700 21px/1 var(--num);color:var(--muted);padding-bottom:2px}
.pick .unit{font-size:13px;color:var(--muted);padding-bottom:3px}
.pick .val.bump{animation:bump .9s ease-out}
@keyframes bump{0%{color:var(--green);transform:translateY(-3px)}100%{color:inherit;transform:none}}
.track{position:relative;height:8px;border-radius:999px;background:var(--card2);margin:12px 0 9px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--amber);transition:width .6s}
.track b{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text)}
.track.mid b{left:50%}
.pick.waiting .track i{background:var(--faint)}
.pick.hit .track i,.pick.won .track i{background:var(--green)}
.pick.bust .track i,.pick.lost .track i{background:var(--red)}
.pick .foot{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.pick .foot .live{color:var(--amber);font-weight:650}
.pick .foot .linkbtn{padding:0;margin-left:auto}
.chip{display:inline-block;font:700 12.5px/1 var(--ui);padding:7px 11px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap;margin-left:auto;align-self:center}
.chip.hit,.chip.won,.chip.cashout{background:rgba(47,224,138,.14);color:var(--green)}
.chip.bust,.chip.lost{background:rgba(255,77,99,.14);color:var(--red)}
.chip.live,.chip.open{background:rgba(255,197,61,.13);color:var(--amber)}
.x{position:absolute;top:10px;right:10px;min-width:30px;height:30px;border-radius:10px;color:var(--faint);padding:0 6px;font-size:14px}
.x.armed{background:rgba(255,77,99,.14);color:var(--red);font-weight:700;font-size:13px}
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 2px 10px}
.gamehead .t{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.gamehead .t .tlogo{width:20px;height:20px}
.gamehead .t .tlogo.flag{width:21px;height:14px;border-radius:3px}
.gamehead .sc{font:800 19px/1 var(--num);font-variant-numeric:tabular-nums}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.summary span{font-size:13px;padding:6px 11px;border-radius:999px;background:var(--card);color:var(--muted)}
.pace{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted);margin:-1px 0 8px}
.pace .pc{margin-left:auto;font:800 20px/1 var(--num)}
.pace .pc small{font:600 11.5px var(--ui);color:var(--muted);margin-left:4px}
.pace.good .pc{color:var(--green)}
.pace.mid .pc{color:var(--amber)}
.pace.bad .pc{color:var(--red)}

/* game screen */
.sheet-bg{position:fixed;inset:0;background:rgba(4,8,18,.62);z-index:40;display:none}
.sheet-bg.show{display:block}
.panel{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;display:none}
.panel.show{display:block}
.panel .wrap{padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
.back{display:flex;align-items:center;gap:6px;font-weight:650;color:var(--accent2);padding:8px 0}
.scorebox{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;text-align:center;padding:12px 0 4px}
.scorebox .crest{display:flex;justify-content:center;margin-bottom:6px}
.scorebox .crest .tlogo{width:56px;height:56px}
.scorebox .crest .tlogo.flag{width:54px;height:36px;border-radius:7px;margin:10px 0}
.scorebox .crest .tlogo .mono{font-size:19px}
.scorebox .abbr{font-size:12.5px;color:var(--muted);font-weight:650}
.scorebox .nm{font-weight:650;font-size:14px;margin-top:2px;line-height:1.25}
.scorebox .sc{font:800 50px/1 var(--num);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:4px}
.setgrid{display:grid;gap:4px 10px;justify-content:center;margin:12px 0 8px;font-variant-numeric:tabular-nums}
.setgrid span{font:700 20px/1 var(--num);color:var(--faint);text-align:center;min-width:18px}
.setgrid span.w{color:var(--text)}
.setgrid span.nm{font:600 13px/1.4 var(--ui);color:var(--muted);text-align:left}
.mprops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.mprops button{padding:10px 4px;border-radius:14px;background:var(--card2);font-weight:700;font-size:13.5px}
.mprops button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:2px}
.player{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.player:last-child{border-bottom:0}
.player .num{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--num);color:var(--muted);flex:none;overflow:hidden;position:relative}
.player .num img{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);max-width:none}
.player .num.img{color:transparent}
.player .num.flag img{left:-36.5%;top:-39%;width:173%;height:173%;transform:none;object-fit:fill}
.player .jn{color:var(--faint);font-size:12.5px;font-weight:600;margin-left:6px}
.player .nm{font-weight:650}
.player .ln{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.player.dnp{opacity:.5}
.player .iconbtn{width:30px;height:30px;border-radius:10px;font-size:18px}
.grouphead{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 2px 4px;font-size:13px;font-weight:700;color:var(--accent2)}
.tracked{font-size:11.5px;color:var(--accent2);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px}
.switch{width:48px;height:29px;border-radius:999px;background:var(--card2);position:relative;flex:none;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#c9d3e3;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on:after{left:22px;background:#fff}

/* bottom sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:28px 28px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(3,7,16,.5)}
.sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.stats button{padding:10px 0;border-radius:14px;background:var(--card2);font-weight:700;font-size:13.5px}
.stats button small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.stats button.on{background:var(--text);color:var(--bg)}
.stats button.on small{color:#46526a}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px 0;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
.seg button.on.more{color:var(--green)}
.seg button.on.less{color:var(--red)}
.linebox{display:flex;align-items:center;gap:8px}
.linebox input{flex:1;min-width:0;text-align:center;font:800 30px/1 var(--num);padding:10px;border-radius:14px;background:var(--sunk);border:1px solid transparent}
.linebox input:focus{border-color:var(--line2);outline:none}
.linebox .iconbtn{width:48px;height:50px;font-size:22px;font-weight:700;border-radius:14px}
.label{font-size:13px;color:var(--muted);font-weight:650;margin:14px 0 7px}
.sheethead{display:flex;align-items:center;gap:12px}
.subrow{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:2px}
.setgrid span.now{color:var(--amber)}

/* alerts: a timeline in one list */
.alert{display:flex;gap:12px}
.alert .stripe{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none;margin-top:6px}
.alert.event .stripe{background:var(--accent)}
.alert.hit .stripe{background:var(--green);box-shadow:0 0 0 4px rgba(47,224,138,.14)}
.alert.bust .stripe{background:var(--red);box-shadow:0 0 0 4px rgba(255,77,99,.14)}
.alert.final .stripe{background:var(--blue)}
.alert.score .stripe{background:var(--amber)}
.alert.slip .stripe{background:var(--accent2)}
.alert.ladder .stripe{background:var(--green)}
.alert.line .stripe{background:var(--blue)}
.alert.pace .stripe{background:var(--amber)}
.alert .ttl{font-weight:650}
.alert .body{white-space:pre-line;color:var(--muted);font-size:13.5px;margin-top:3px}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:60;max-width:616px;margin:0 auto;background:#203051;border-radius:18px;padding:12px 14px 12px 36px;box-shadow:0 14px 36px rgba(3,7,16,.6);transform:translateY(-150%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
.toast:before{content:"";position:absolute;left:15px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.toast.show{transform:none;visibility:visible;transition:transform .3s ease}
.toast.hit:before{background:var(--green)}
.toast.bust:before{background:var(--red)}
.toast .ttl{font-weight:700}
.toast .body{white-space:pre-line;color:var(--muted);font-size:13px;margin-top:2px}
.code{font:600 15px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--sunk);border-radius:12px;padding:10px 12px;word-break:break-all}
ol.steps{margin:6px 0 0;padding-left:20px}
ol.steps li{margin:5px 0}
.qr{background:#fff;border-radius:12px;padding:8px;display:inline-block;line-height:0}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lgrid button{text-align:left;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:13.5px;display:flex;align-items:center;gap:9px}
.lgrid button .tick{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#1d0c00}
.lgrid button.on .tick{background:var(--accent);border-color:var(--accent)}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--accent);animation:sp .9s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* lines, form, plays */
.lines{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
.lines b{color:var(--text);font-weight:650}
.lchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.lchips::-webkit-scrollbar{display:none}
.lchip{flex:none;padding:8px 12px;border-radius:14px;background:var(--card2);font-size:13px;font-weight:700;white-space:nowrap;text-align:center}
.lchip small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.lchip.on{background:var(--text);color:var(--bg)}
.lchip.on small{color:#46526a}
.price{font-weight:750;font-variant-numeric:tabular-nums}
.formbox{background:var(--sunk);border-radius:14px;padding:12px 14px}
.formbox .big{font-weight:700}
.spark{display:block;width:100%;height:54px;margin-top:8px}
.play .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.play .chance{font:800 40px/.9 var(--num);font-variant-numeric:tabular-nums;color:var(--green);text-align:right}
.play .chance small{display:block;font:600 11.5px var(--ui);color:var(--muted);margin-top:4px}
.play .kind{font-size:13px;color:var(--muted);margin-top:6px}
.leg{padding:10px 0;border-top:1px solid var(--line)}
.leg .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.leg .l2{font-weight:600;margin-top:1px}
.leg .l3,.leg .why{font-size:12.5px;color:var(--muted)}
.leg .why{margin-top:2px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--card2);font:800 14px/1 var(--num);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.step .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .r{text-align:right;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer}
.mini .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.rule input,.bal input{width:88px;text-align:center;padding:9px;border-radius:12px;background:var(--sunk);border:0;font-weight:700}
.bal{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.segs{display:flex;background:var(--card);border-radius:16px;padding:4px;gap:4px;margin:0 0 14px}
.segs button{flex:1;padding:9px 0;border-radius:12px;font-weight:700;color:var(--muted);font-size:14px}
.segs button.on{background:var(--card2);color:var(--text)}
.segs button .n{font-size:11.5px;color:var(--accent2);margin-left:5px}
.scr{padding:12px 16px}
.scr .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.scr .l2{font-size:13.5px;font-weight:600;margin-top:1px}
.scr .l3{font-size:12.5px;color:var(--muted);margin-top:3px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.filters select,.filters input{padding:8px 10px;font-size:13px;border-radius:12px;background:var(--card);border:0}
.filters input{width:66px;text-align:center}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;padding:7px 12px;border-radius:999px;background:var(--card2);font-size:12.5px;font-weight:700;color:var(--muted)}
.fchips button.on{background:var(--text);color:var(--bg)}
/* matchups: a heat scale from gold (elite) down to red (tough) */
:root{--mu-elite:#f2c94c;--mu-great:#3ddc97;--mu-good:#a3e7c8;--mu-even:#5d6a83;--mu-tough:#ff6b7d}
.tip.mu-elite{background:linear-gradient(100deg,rgba(242,201,76,.13),rgba(242,201,76,0) 62%);box-shadow:inset 0 0 0 1.5px rgba(242,201,76,.85),0 0 22px rgba(242,201,76,.10);border-radius:14px}
.tip.mu-great{box-shadow:inset 3px 0 0 var(--mu-great)}
.tip.mu-good{box-shadow:inset 3px 0 0 var(--mu-good)}
.tip.mu-tough{box-shadow:inset 3px 0 0 var(--mu-tough)}
.list > .tip.mu-elite + .tip,.list > .tip + .tip.mu-elite{border-top-color:transparent}
.mut{color:var(--muted)}
.mut b{font-weight:750}
.mut.elite b{color:var(--mu-elite)}.mut.great b{color:var(--mu-great)}.mut.good b{color:var(--mu-good)}.mut.tough b{color:var(--mu-tough)}
.mutier{flex:none;font:800 11.5px/1 var(--ui);letter-spacing:.02em;padding:6px 9px;border-radius:999px;background:var(--card2);color:var(--muted)}
.mutier.elite{background:linear-gradient(135deg,#f7dd85,#d9a92f);color:#2a1f05}
.mutier.great{background:rgba(61,220,151,.16);color:var(--mu-great)}
.mutier.good{background:rgba(163,231,200,.12);color:var(--mu-good)}
.mutier.tough{background:rgba(255,107,125,.14);color:var(--mu-tough)}
.mukey{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:2px 2px 12px}
.mukey span{display:inline-flex;align-items:center;gap:5px}
.mukey i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mutab .row{gap:10px;padding:8px 0;font-size:14px}
.mutab .row + .row{border-top:1px solid var(--line)}
.mutab .rk{width:26px;flex:none;font:800 16px/1 var(--num);color:var(--muted);text-align:right}
.mutab .tm{width:52px;flex:none;font-weight:750}
.mutab .bar{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.mutab .bar i{display:block;height:100%;border-radius:99px}
.mutab .v{width:44px;flex:none;text-align:right;font:800 16px/1 var(--num);font-variant-numeric:tabular-nums}
.mutab .nx{width:56px;flex:none;font-size:12px;color:var(--muted);text-align:right}
/* the projection beside a graded spot */
.mupj{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:8px;text-align:right}
.mupj .pj{font:800 21px/1 var(--num);font-variant-numeric:tabular-nums}
.mupj .pl{font-size:11px;line-height:1.2;color:var(--muted);white-space:nowrap}
.mupj .pl.up{color:var(--green)}.mupj .pl.down{color:var(--red)}
.muchip{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;font:800 10.5px/1.15 var(--ui);vertical-align:1px;cursor:pointer}
.muchip.elite{background:linear-gradient(135deg,#f7dd85,#d9a92f);color:#2a1f05}
.muchip.great{background:rgba(61,220,151,.16);color:var(--mu-great)}
.mubox{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card);font-size:13px;line-height:1.45;color:var(--muted)}
.mubox .t{font-weight:750;color:var(--text)}
.mubox.elite{background:linear-gradient(100deg,rgba(242,201,76,.13),rgba(242,201,76,0) 70%),var(--card);box-shadow:inset 0 0 0 1.5px rgba(242,201,76,.85)}
.mubox.elite .t{color:var(--mu-elite)}.mubox.great .t{color:var(--mu-great)}.mubox.good .t{color:var(--mu-good)}.mubox.tough .t{color:var(--mu-tough)}
.mubox.great{box-shadow:inset 3px 0 0 var(--mu-great)}.mubox.good{box-shadow:inset 3px 0 0 var(--mu-good)}.mubox.tough{box-shadow:inset 3px 0 0 var(--mu-tough)}
.mubox .pj{margin-top:6px;color:var(--text);font-weight:650}
.card.ckleg.mu-elite{background:linear-gradient(100deg,rgba(242,201,76,.10),rgba(242,201,76,0) 62%),var(--card);box-shadow:inset 0 0 0 1.5px rgba(242,201,76,.85)}
.card.ckleg.mu-great{box-shadow:inset 3px 0 0 var(--mu-great)}.card.ckleg.mu-good{box-shadow:inset 3px 0 0 var(--mu-good)}.card.ckleg.mu-tough{box-shadow:inset 3px 0 0 var(--mu-tough)}
.ckmu{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:13px;line-height:1.4;color:var(--muted)}
.ckmu .mutier{margin-top:1px}
.murr{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.murr + .murr{border-top:1px solid var(--line)}
.murr .res{flex:none;width:38px;text-align:center;font:800 10.5px/1.6 var(--ui);border-radius:999px;background:var(--card2);color:var(--muted)}
.murr .res.won{background:rgba(47,224,138,.14);color:var(--green)}.murr .res.lost{background:rgba(255,77,99,.14);color:var(--red)}
.murr .v{flex:none;font:800 15px/1 var(--num);font-variant-numeric:tabular-nums}
/* the Plays tab's reach: every sport or the Games tab's leagues */
.plscope{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 2px 10px;font-size:12.5px;color:var(--muted)}
/* today's elite spots and the record */
.dayhd{display:flex;align-items:center;gap:12px}
.daybig{flex:none;text-align:right}
.daybig b{display:block;font:800 30px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--mu-elite)}
.daybig small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.daybig.left{text-align:left}.daybig.left b{color:var(--text)}
.dchip{display:inline-block;padding:3px 8px;border-radius:999px;font:800 11px/1.25 var(--ui);background:var(--card2);color:var(--muted);white-space:nowrap}
.dchip.won{background:rgba(47,224,138,.16);color:var(--green)}.dchip.lost{background:rgba(255,77,99,.16);color:var(--red)}
.dchip.live{background:rgba(92,168,255,.16);color:var(--blue)}
.dayrow.won .pj{color:var(--green)}.dayrow.lost .pj{color:var(--red)}
.dayrow.lost{opacity:.82}
.rects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.rect{background:var(--sunk);border-radius:12px;padding:10px 8px;text-align:center}
.rect small{display:block;font-size:11.5px;color:var(--muted)}
.rect b{display:block;font:800 24px/1.1 var(--num);font-variant-numeric:tabular-nums;margin:4px 0 2px}
.rect span{font-size:11.5px;color:var(--muted)}
.wkbars{position:relative;display:flex;gap:4px;align-items:flex-end;margin-top:4px}
.wk{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.wk .wv{height:14px;font:700 10px/14px var(--num);color:var(--muted);white-space:nowrap}
.wk .wa{height:70px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wk .wa i{display:block;width:76%;max-width:22px;border-radius:3px 3px 1px 1px;background:var(--blue)}
.wk .wa i.hot{background:var(--green)}.wk .wa i.cold{background:var(--red)}
.wk .wn{font:700 10.5px/14px var(--num);color:var(--text);margin-top:3px}
.wk .wl{font-size:9.5px;line-height:12px;color:var(--faint)}
.wk.now .wl{color:var(--text)}
.wk50{position:absolute;left:0;right:0;top:49px;border-top:1.5px dashed rgba(238,243,250,.35);pointer-events:none}
.recrow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px}
.recrow + .recrow{border-top:1px solid var(--line)}
.recrow .nm{flex:0 0 46%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recrow .rb{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.recrow .rb i{display:block;height:100%;background:var(--blue);border-radius:99px}
.recrow .rb i.hot{background:var(--green)}.recrow .rb i.cold{background:var(--red)}
.recrow b{flex:none;width:38px;text-align:right;font:800 14px var(--num)}
.recrow small{flex:none;width:44px;text-align:right;color:var(--muted);font-size:11.5px}
/* hit rates on the pick sheet */
.hrt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 10px}
.hrt.n3{grid-template-columns:repeat(3,1fr)}.hrt.n2{grid-template-columns:repeat(2,1fr)}
.hr{background:var(--card);border-radius:10px;padding:8px 4px 7px;text-align:center;min-width:0}
.hr b{display:block;font:800 19px/1.05 var(--num);font-variant-numeric:tabular-nums}
.hr span{display:block;font-size:11px;line-height:1.2;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr.hot b{color:var(--green)}.hr.warm b{color:#a3e7c8}.hr.cold b{color:var(--red)}.hr.none b{color:var(--faint)}
.hbars{position:relative;display:flex;gap:3px;margin:10px 0 2px}
.hb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.hb .hv{height:15px;font:700 11px/15px var(--num);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hb.hit .hv{color:var(--green)}
.hb .ha{height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.hb .ha i{display:block;width:80%;max-width:24px;border-radius:3px 3px 1px 1px;background:var(--blue)}
.hb.hit .ha i{background:var(--green)}.hb.miss .ha i{background:#33456b}.hb.prev .ha i{opacity:.55}
.hb .ho{margin-top:4px;font-size:9.5px;line-height:12px;color:var(--faint);white-space:nowrap;overflow:hidden;max-width:100%}
.hbars .hl{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed rgba(238,243,250,.8);pointer-events:none}
.sel{position:absolute;top:16px;left:14px;width:24px;height:24px;border-radius:8px;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#1d0c00}
.sel.on{background:var(--accent);border-color:var(--accent)}
.pick.selecting{padding-left:50px;cursor:pointer}
.slipbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:25;padding:0 14px}
.slipbar .in{max-width:612px;margin:0 auto;background:#203051;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(3,7,16,.6)}

/* tips: one game read like a form guide. The predicted score is set in the scoreboard face,
   the chance is the number to look at, the price sits under it. */
.gseg{margin:2px 0 12px}
.wbar .ends{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.wbar .end{display:flex;align-items:center;gap:9px;min-width:0}
.wbar .end.r{flex-direction:row-reverse;text-align:right}
.wbar .end b{font:800 34px/.9 var(--num);font-variant-numeric:tabular-nums;color:var(--muted)}
.wbar .end.fav b{color:var(--text)}
.wbar .end small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.wbar .dr{font-size:12.5px;color:var(--muted);font-weight:650;padding-bottom:4px;text-align:center}
.wbar .dr b{display:block;font:800 20px/1 var(--num);color:var(--muted)}
.wbar .bar{display:flex;height:9px;border-radius:999px;overflow:hidden;margin-top:12px;gap:3px}
.wbar .bar i{display:block;height:100%;border-radius:2px;min-width:3px}
.pscore{text-align:center;margin:18px 0 2px}
.pscore .lab{font-size:12.5px;color:var(--muted);font-weight:650}
.pscore .sc{font:800 54px/1 var(--num);font-variant-numeric:tabular-nums;margin:3px 0 2px;letter-spacing:.01em}
.pscore .sc span{color:var(--faint);margin:0 .12em}
.pscore .sub{font-size:13px;color:var(--muted)}
.alsos{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.alsos span{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--muted);font-variant-numeric:tabular-nums}
.alsos span b{color:var(--text);font-weight:700;margin-right:5px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.facts div{background:var(--sunk);border-radius:12px;padding:9px 11px;font-size:12.5px;color:var(--muted);min-width:0}
.facts div b{display:block;font:800 20px/1.05 var(--num);color:var(--text);font-variant-numeric:tabular-nums;margin-bottom:1px}
.formrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:12.5px;color:var(--muted)}
.formrow .who{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text);font-weight:650;font-size:13px}
.formrow .who .tlogo{width:20px;height:20px}
.formrow .who .tlogo.flag{width:21px;height:14px;border-radius:3px}
.formrow .who small{color:var(--muted);font-weight:500;font-size:12px}
.wl{display:inline-flex;gap:3px}
.wl i{width:19px;height:19px;border-radius:6px;font:800 10.5px/19px var(--ui);text-align:center;font-style:normal;background:var(--card2);color:var(--muted)}
.wl i.W{background:rgba(47,224,138,.18);color:var(--green)}
.wl i.L{background:rgba(255,77,99,.16);color:var(--red)}
.srcs{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center}
.tip{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;cursor:pointer}
.list > .tip + .tip{border-top:1px solid var(--line)}
.tip .av{width:40px;height:40px}
.tip .av .mono{font-size:13.5px}
.tip .av.pair .tlogo{width:27px;height:27px}
.tip .av.pair .tlogo + .tlogo{top:13px;left:13px}
.tip .tk{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:1px}
.tip .t1{font-weight:700;line-height:1.25}
.tip .t2{font-size:14px;font-weight:600;margin-top:1px;line-height:1.3}
.tip .t3{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.tip .r{text-align:right;flex:none;min-width:52px}
.tip .pc{font:800 27px/.95 var(--num);font-variant-numeric:tabular-nums}
.tip .pc.hi{color:var(--green)}
.tip .pr{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap}
.tip .pr b{color:var(--text);font-weight:750}
.tip .add{width:32px;height:32px;border-radius:11px;font-size:18px;font-weight:700}
.tip .add.on{color:var(--green)}
.meter{height:4px;border-radius:999px;background:var(--card2);margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--text)}
.meter.hi i{background:var(--green)}
.sgm .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sgm .kind{font-weight:700}
.sgm .kind small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.sgm .chance{font:800 36px/.9 var(--num);font-variant-numeric:tabular-nums;color:var(--green);text-align:right}
.sgm .chance small{display:block;font:600 11.5px var(--ui);color:var(--muted);margin-top:4px}
.sgm .lg{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sgm .lg:first-of-type{margin-top:10px}
.sgm .lg .grow{font-size:14px;line-height:1.3}
.sgm .lg .grow small{display:block;font-size:12.5px;color:var(--muted)}
.sgm .lg .price{font-size:14px}
.checker .row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.checker .row2:first-of-type{border-top:0;padding-top:4px}
.checker .stp{display:flex;align-items:center;gap:6px}
.checker .stp button{width:34px;height:34px;border-radius:11px;background:var(--card2);font-size:18px;font-weight:700;color:var(--muted)}
.checker .stp b{font:800 24px/1 var(--num);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.checker .out{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1 / -1}
.checker .out button{text-align:left;padding:9px 11px;border-radius:12px;background:var(--sunk);font-size:12.5px;color:var(--muted)}
.checker .out button b{display:block;color:var(--text);font-size:13.5px;font-weight:700;margin-bottom:1px}
.checker .out button .v{font:800 19px/1.1 var(--num);color:var(--text)}
.checker .out button.hi .v{color:var(--green)}
.basis{font-size:12.5px;color:var(--muted);margin:2px 4px 14px;line-height:1.45}

/* plays: with more than four views the switch scrolls sideways instead of squashing the names */
.segs.many{overflow-x:auto;scrollbar-width:none}
.segs.many::-webkit-scrollbar{display:none}
.segs.many button{flex:1 0 auto;padding:9px 12px}
/* the tips feed and the multi builder */
.feedhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px;min-height:34px}
.readbar{height:4px;border-radius:999px;background:var(--card2);overflow:hidden;margin:-4px 2px 12px}
.readbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
.tip .pr small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.record{display:flex;align-items:center;gap:12px;cursor:pointer}
.record .rline{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.record .rline .big2{margin:0}
.record .chev{font-size:26px;line-height:1;color:var(--faint)}
.recbar{display:grid;grid-template-columns:78px minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);padding:6px 0}
.recbar .track{margin:0}
.recbar .n{text-align:right;font:800 18px/1 var(--num);color:var(--text);font-variant-numeric:tabular-nums}
.recbar .n small{display:block;font:500 11px var(--ui);color:var(--muted);margin-top:2px}
.reclist .legrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
.reclist .legrow + .legrow{border-top:1px solid var(--line)}
.reclist .legrow .lm{margin-top:1px}
.warn{color:var(--amber);font-size:13px}
.warn:empty{display:none}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.rule input[type=time]{width:118px}
/* check a bet */
.vchip{flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--card2);color:var(--muted)}
.ckswap{border-color:rgba(78,163,255,.45)}
.vchip.good{background:rgba(52,199,89,.16);color:var(--green)}
.vchip.fair{background:rgba(255,179,64,.16);color:var(--amber)}
.vchip.poor{background:rgba(255,90,90,.16);color:var(--red)}
.ckbig{font:800 40px/1 var(--num);margin-top:6px;font-variant-numeric:tabular-nums}
.ckbig small{display:block;font:500 12.5px var(--ui);color:var(--muted);margin-top:4px}
.ckstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px;text-align:center}
.cksum .ckstats{grid-template-columns:repeat(3,minmax(0,1fr))}
.ckstats > div{background:var(--bg);border-radius:10px;padding:8px 4px}
.ckstats small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.ckstats b{font:800 16px/1.15 var(--num);font-variant-numeric:tabular-nums}
.ckstats b small{display:block;font:500 10.5px var(--ui);color:var(--faint);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckstats input{width:64px;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--text);font:800 16px var(--num);text-align:center;padding:0}
.ckleg .ckstats input{width:50px}
.ckbest{margin-top:7px}.ckbest:empty{display:none}
/* prices on legs in the slip sheets */
.vleg .vpx{flex:none;display:flex;align-items:center;gap:2px;margin-left:4px}
.vleg .vpx input{width:58px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font:700 14px var(--num);text-align:center;padding:6px 2px}
.vleg.off .vpx input{opacity:.45}
.ckwhy{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.45}
.ckwhy li + li{margin-top:3px}
.ckleg .t1{font-weight:700}.ckleg .t2{font-size:14px;margin-top:1px}.ckleg .t3{font-size:12.5px;color:var(--muted);margin-top:2px}
.tip .chev{font-size:24px;color:var(--faint);align-self:center}

/* slips look like a bet ticket: a tear line with notches */
.slip{position:relative}
.slip .tear{position:relative;border-top:2px dashed var(--line2);margin:12px -16px 4px}
.slip .tear:before,.slip .tear:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.slip .tear:before{left:-9px}
.slip .tear:after{right:-9px}
.slip .legrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
.slip .legrow + .legrow{border-top:1px solid var(--line)}
.slip .legrow .lm{margin-top:1px}
.lm{width:18px;height:18px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font:900 10.5px/1 var(--ui);vertical-align:-3px}
.lm.won{background:rgba(47,224,138,.16);color:var(--green)}
.lm.lost{background:rgba(255,77,99,.16);color:var(--red)}
.lm.void{background:var(--card2);color:var(--muted)}
.lm.open{box-shadow:inset 0 0 0 2px var(--faint)}
.lm.live{box-shadow:inset 0 0 0 2px var(--amber)}
.slip .tally{font-size:13px;color:var(--muted)}
.slip .live{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card2)}
.slip .live .big{font:700 15px/1.3 var(--ui)}
.slip .live .big b{font-size:18px}
.slip .legrow .who{cursor:pointer}
.slip .money{display:flex;align-items:flex-end;gap:16px;margin-top:10px}
.slip .money div{display:flex;flex-direction:column;gap:3px}
.slip .money small{font-size:12px;color:var(--muted);font-weight:600}
.slip .money b{font:800 26px/1 var(--num);font-variant-numeric:tabular-nums}
.slip .legrow.voided .who{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.vtag{display:inline-block;font:700 11px/1.55 var(--ui);color:var(--muted);background:var(--card2);border-radius:6px;padding:0 6px;margin-left:5px;vertical-align:1px}
.slip .was{font-size:12.5px;color:var(--muted);margin-top:7px}
.slip .reprice{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,197,61,.08);box-shadow:inset 0 0 0 1px rgba(255,197,61,.32);display:flex;gap:10px;align-items:center;font-size:13.5px}
.vlegs{margin-top:10px;border-radius:12px;background:var(--sunk);padding:2px 12px}
.vleg{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px}
.vleg + .vleg{border-top:1px solid var(--line)}
.vleg .t{flex:1;min-width:0}
.vleg.off .t{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.slip .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.danger{color:var(--red);background:rgba(255,77,99,.12)}
.slip.won,.slip.cashout{box-shadow:inset 0 0 0 1.5px rgba(47,224,138,.4)}
.slip.lost{box-shadow:inset 0 0 0 1.5px rgba(255,77,99,.35)}
.big2{font:800 30px/1 var(--num);font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.statgrid > div{background:var(--sunk);border-radius:14px;padding:10px 4px}
.statgrid small{display:block;color:var(--muted);font-size:11.5px;font-weight:650}
table.mk{width:100%;border-collapse:collapse;font-size:13.5px}
table.mk th{color:var(--muted);font-weight:650;font-size:12px;text-align:right;padding:2px 2px 7px}
table.mk th:first-child,table.mk td:first-child{text-align:left}
table.mk td{padding:8px 2px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
table.mk td small{display:block;color:var(--muted);font-size:11.5px}
.pos{color:var(--green)}
.neg{color:var(--red)}
.wp{display:block;width:100%;height:110px;margin-top:8px}
.pbp{font-size:13.5px}
.pbp .pl{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.pbp .pl:first-child{border-top:0}
.pbp .pl .c{width:64px;flex:none;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.pbp .pl.sc .t{font-weight:650}
.pbp .pl .s{flex:none;font:800 17px/1.1 var(--num);font-variant-numeric:tabular-nums}
.mu{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.prog{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;margin:12px 0 4px;position:relative}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px}
.prog.rungs:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--card) calc(10% - 2px) 10%)}
/* 100%: team by team */
.thead{display:flex;align-items:center;gap:10px;margin:22px 2px 9px}
.thead .tlogo{width:32px;height:32px}
.thead .tlogo .mono{font-size:12px}
.thead .tn{font-weight:700;font-size:16px;line-height:1.2}
.thead .cnt{font:800 22px/1 var(--num);color:var(--green);min-width:22px;text-align:right}
.pf{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.pf .av{width:40px;height:40px}
.pf .av .mono{font-size:14px}
.pf .l1{font-weight:650;line-height:1.25}
.pf .l2{font-size:14px;margin-top:1px}
.pf .l3{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--muted);margin-top:3px}
.pf .pr{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.pf .pr .price{font:800 20px/1 var(--num);font-variant-numeric:tabular-nums}
.pf .iconbtn{width:34px;height:34px;font-size:20px;font-weight:700;color:var(--text)}
.pf .iconbtn.on{background:rgba(47,224,138,.14);color:var(--green);font-size:15px}
.showall{display:block;width:100%;padding:9px 0 2px;color:var(--accent2);font-weight:650;font-size:13.5px;text-align:center}
@media (min-width:700px){.wrap{padding-top:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Overline 5.0 ----------
   Cleaner and brighter. The overline, an orange bar set over a heading the way it sits over the O in the logo,
   marks every section. Cards carry the player, colour carries the result: green over, red under. */
:root{
  --bg:#090f1c;--card:#121b2e;--card2:#1b2843;--sunk:#0c1426;
  --line:rgba(164,186,226,.10);--line2:rgba(164,186,226,.22);
  --text:#f5f8fd;--muted:#a4b0c6;--faint:#67748d;
  --accent:#ff7a1a;--accent2:#ffa363;--green:#34eb98;--red:#ff5169;--amber:#ffc84a;--blue:#66b6ff;--gold:#ffd36b;
  --hi:inset 0 1px 0 rgba(255,255,255,.045);
  --r:22px;--r2:18px;--r3:12px;
}
h2{font:750 18px/1.25 var(--ui);margin:28px 2px 12px}
h2:before,.sh:before{content:"";display:block;width:20px;height:4px;border-radius:2px;background:var(--accent);margin:0 0 8px}
.sh{font:750 16px/1.2 var(--ui);margin:24px 2px 10px}
.card,.list{box-shadow:var(--hi)}
.card{border-radius:var(--r)}
.pill{background:var(--card2);color:var(--text);font-weight:600}
.chip-btn{background:var(--card2);color:var(--text)}
.chip-btn.on{background:var(--text);color:var(--bg)}
.btn{border-radius:15px}
.btn.primary{background:linear-gradient(180deg,#ff8a33,#ff7314);color:#1d0c00;box-shadow:0 8px 20px -10px rgba(255,122,26,.8)}
.segs{background:var(--sunk);box-shadow:var(--hi)}
.segs button.on{background:var(--card2);color:var(--text);box-shadow:var(--hi)}
.search{background:var(--card2)}

/* the dock: the tab you're on gets the overline */
nav.tabs{background:linear-gradient(to top,var(--bg) 60%,rgba(9,15,28,0))}
nav.tabs .in{background:rgba(25,37,64,.92);box-shadow:0 12px 32px rgba(2,6,14,.6),inset 0 1px 0 rgba(255,255,255,.06)}
nav.tabs button.on{background:rgba(245,248,253,.08);color:var(--text)}
nav.tabs button.on:before{content:"";position:absolute;top:3px;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--accent)}

/* games list */
.game .team{font-size:16px}
.game .team .score{font-size:26px}
.game .meta .r{color:var(--accent2)}

/* the line on a pick reads like the logo: a bar running past a white tick */
.track{height:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.track i{background:linear-gradient(90deg,#ffb347,var(--accent))}
.track b{width:3px;margin-left:-1.5px;top:-6px;bottom:-6px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px var(--card)}
.pick.waiting .track i{background:var(--faint)}
.pick.hit .track i,.pick.won .track i{background:linear-gradient(90deg,#1fd17f,var(--green))}
.pick.bust .track i,.pick.lost .track i{background:linear-gradient(90deg,#d63b54,var(--red))}
.pick .val{font-size:52px}
.pick.hit{box-shadow:var(--hi),inset 0 0 0 1.5px rgba(52,235,152,.35)}
.badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px}

/* streaks: a flame and how many in a row */
.flame{display:inline-flex;align-items:center;gap:3px;padding:3px 8px 3px 6px;border-radius:999px;font:800 13px/1 var(--num);color:#ffb15c;background:rgba(255,122,26,.15);vertical-align:1px;white-space:nowrap;letter-spacing:.01em}
.flame svg{width:11px;height:14px;flex:none}
.flame.hot{color:var(--gold);background:linear-gradient(135deg,rgba(255,211,107,.24),rgba(255,81,105,.22));box-shadow:0 0 14px rgba(255,140,40,.3)}
.flame.lg{margin-left:auto;font-size:17px;padding:5px 11px 5px 8px;background:rgba(9,15,28,.34);color:#fff;box-shadow:none}
.flame.lg svg{width:14px;height:18px}
.flame.sum{font-size:22px;background:none;padding:0;gap:4px;color:#ffb15c;box-shadow:none}
.flame.sum svg{width:14px;height:18px}
.tip .t1 .flame,.pf .l1 .flame,.leg .flame{margin-left:6px}

/* on the floor or the pitch, while the game's on */
.oncourt{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font:700 12px/1 var(--ui);background:rgba(52,235,152,.13);color:var(--green);white-space:nowrap}
.oncourt:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(52,235,152,.2);animation:pulse 1.6s ease-in-out infinite}
.oncourt.off{background:rgba(164,186,226,.1);color:var(--muted)}
.oncourt.off:before{animation:none;box-shadow:none}
.ondot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(52,235,152,.2);margin-right:7px;vertical-align:1px}

/* the player sheet */
.sheet{background:#0e1627;max-height:94vh;padding-top:12px}
.sheet .label{margin-top:16px}
.pcard{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:16px 18px;min-height:250px;color:var(--pc-ink,#fff);background:var(--pc-bg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px -20px var(--pc-glow,rgba(0,0,0,.7))}
.pcard.t-great{--pc-bg:linear-gradient(150deg,#ffbe5c 0%,#ff7a1a 46%,#c84a0b 100%);--pc-glow:rgba(255,122,26,.65);--pc-ink:#1c0b00;--pc-glass:rgba(255,255,255,.26);--pc-band:rgba(255,236,214,.34);--pc-rule:rgba(28,11,0,.18)}
.pcard.t-good{--pc-bg:linear-gradient(150deg,#52e8bd 0%,#16b088 48%,#0b5f55 100%);--pc-glow:rgba(40,210,160,.5);--pc-ink:#03201a;--pc-glass:rgba(255,255,255,.24);--pc-band:rgba(225,255,244,.3);--pc-rule:rgba(3,32,26,.18)}
.pcard.t-even{--pc-bg:linear-gradient(150deg,#6378a8 0%,#36486f 52%,#1c2845 100%);--pc-glow:rgba(80,110,170,.5)}
.pcard.t-tough{--pc-bg:linear-gradient(150deg,#ff7a8d 0%,#cc3550 50%,#6a1225 100%);--pc-glow:rgba(255,81,105,.45)}
.pcard.t-none{--pc-bg:linear-gradient(150deg,#2c3d64 0%,#1c2846 55%,#121b2e 100%)}
.pc-face{position:absolute;right:-26px;bottom:0;width:72%;max-width:330px;height:auto;z-index:-1;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}
.pc-mono{position:absolute;right:16px;bottom:58px;z-index:-1;font:800 110px/1 var(--num);opacity:.16}
.pc-mark{position:absolute;right:20px;top:18px;height:74px;width:auto;z-index:-2;opacity:.2;color:var(--pc-ink,#fff)}
.pc-top{display:flex;align-items:center;gap:8px;font:700 12.5px/1 var(--ui);min-height:28px}
.pc-pos{padding:5px 8px;border-radius:8px;background:var(--pc-glass,rgba(255,255,255,.16));font-weight:800}
.pc-team{opacity:.85}
.pc-name{margin-top:10px;max-width:64%}
.pc-name small{display:block;font:650 15px/1.15 var(--ui);opacity:.88}
.pc-name b{display:block;font:800 44px/.92 var(--num);text-transform:uppercase;letter-spacing:.005em;overflow-wrap:anywhere}
.pc-hero{margin-top:16px;max-width:64%}
.pc-ol{display:block;width:30px;height:5px;border-radius:3px;background:currentColor;margin-bottom:7px;opacity:.95}
.pc-hero b{display:block;font:800 66px/.84 var(--num);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pc-lab{display:block;font:750 13.5px/1.25 var(--ui);margin-top:7px}
.pc-lab em{font-style:normal;opacity:.72}
.pc-sub{display:block;font:550 12.5px/1.3 var(--ui);opacity:.82;margin-top:2px}
.pc-foot{display:flex;margin:16px -18px -16px;padding:11px 8px 13px;background:var(--pc-band,rgba(9,15,28,.34))}
.pc-g{flex:1 1 0;min-width:0;padding:2px 10px}
.pc-g + .pc-g{border-left:1px solid var(--pc-rule,rgba(255,255,255,.2))}
.pc-g b{display:block;font:800 25px/1 var(--num);font-variant-numeric:tabular-nums}
.pc-g b small{font-size:15px;opacity:.7}
.pc-g span{display:block;font:650 11px/1.25 var(--ui);opacity:.85;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-inj{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:10px;background:rgba(9,15,28,.4);color:#ffd0d7;font:700 12.5px/1.3 var(--ui)}
.stabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -18px 0;padding:2px 18px 4px}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;min-width:64px;padding:9px 12px 8px;border-radius:14px;background:var(--card2);font:750 14px/1.1 var(--ui);text-align:center;color:var(--text)}
.stabs button small{display:block;font:600 11px var(--ui);color:var(--muted);margin-top:3px;white-space:nowrap}
.stabs button.on{background:var(--text);color:var(--bg)}
.stabs button.on small{color:#4a5670}
.cpanel{background:var(--card);border-radius:22px;padding:14px 14px 14px;margin-top:12px;box-shadow:var(--hi)}
.rtiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rtiles.n4{grid-template-columns:repeat(4,minmax(0,1fr))}.rtiles.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rt{padding:8px 2px 7px;border-radius:13px;background:var(--sunk);text-align:center;min-width:0;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s}
.rt span{display:block;font:700 11px/1.2 var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt b{display:block;font:800 19px/1.05 var(--num);margin-top:3px;font-variant-numeric:tabular-nums}

window.__bridgeDone = (id, raw) => {
  const w = BR.wait[id]; delete BR.wait[id];
  if (!w) return;
  let j = {};
  try { j = JSON.parse(raw || "{}"); } catch(e) { w.rej(new Error("Bad reply")); return; }
  if (j && j.error && j.status) w.rej(new Error(j.error)); else w.res(j);
};
async function api(path, body){
  if (BRIDGE){
    return new Promise((res, rej) => {
      const id = ++BR.seq;
      BR.wait[id] = {res, rej};
      window.AndroidBridge.callAsync(id, body === undefined ? "GET" : "POST", path, body === undefined ? "" : JSON.stringify(body));
    });
  }
  const opt = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  let j = {};
  try { j = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}

/* ---------- time helpers ---------- */
function dayKey(d){ return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function dayLabel(iso){
  const d = new Date(iso); if (isNaN(d)) return "Later";
  const now = new Date(), tm = new Date(now.getTime() + 864e5);
  if (dayKey(d) === dayKey(now)) return "Today";
  if (dayKey(d) === dayKey(tm)) return "Tomorrow";
  return d.toLocaleDateString("en-AU", {weekday:"long", day:"numeric", month:"short"});
}
function timeText(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleTimeString("en-AU", {hour:"numeric", minute:"2-digit"}).replace(" ", "").toLowerCase();
}
function startText(iso){
  if (!iso) return "";
  const l = dayLabel(iso);
  return (l === "Today" ? "" : l.split(" ")[0].slice(0, 3) + " ").replace("Tom ", "Tomorrow ") + timeText(iso);
}
function ago(t){
  const s = Math.max(0, Math.round(Date.now()/1000 - t));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s/60) + " min ago";
  return new Date(t*1000).toLocaleTimeString("en-AU", {hour:"numeric", minute:"2-digit"}).toLowerCase();
}

/* ---------- sound ---------- */
function beep(kind){
  if (!S.sound || !S.audio) return;
  try{
    const ctx = S.audio, now = ctx.currentTime;
    const notes = kind === "hit" ? [660, 880, 1175] : kind === "bust" ? [440, 330] : kind === "final" ? [523, 659, 784] : [880, 1046];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + i*0.12);
      g.gain.exponentialRampToValueAtTime(0.25, now + i*0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.12 + 0.18);
      o.connect(g); g.connect(ctx.destination); o.start(now + i*0.12); o.stop(now + i*0.12 + 0.2);
    });
  }catch(e){}
  try{ if (navigator.vibrate) navigator.vibrate(kind === "hit" || kind === "bust" ? [120,60,120,60,200] : [90]); }catch(e){}
}
function toggleSound(){
  if (!S.sound){
    try{ S.audio = S.audio || new (window.AudioContext || window.webkitAudioContext)(); S.audio.resume(); S.sound = true; beep("event"); }
    catch(e){ S.sound = false; }
  } else S.sound = false;
  render();
}

/* ---------- data ---------- */
async function loadState(){
  try{
    const st = await api("/api/state");
    const prevLast = S.state ? S.state.last_alert_id : null;
    S.state = st;
    if (S.lastAlertSeen == null) S.lastAlertSeen = LS.get("seen", st.last_alert_id);
    if (prevLast != null && st.last_alert_id > prevLast){
      const fresh = st.alerts.filter(a => a.id > prevLast && !a.quiet);
      if (fresh.length){
        const top = fresh.find(a => a.kind === "hit" || a.kind === "bust") || fresh[fresh.length-1];
        toast(top); beep(top.kind);
      }
    }
    if (S.tab === "alerts") { S.lastAlertSeen = st.last_alert_id; LS.set("seen", S.lastAlertSeen); }
    S.unseen = st.alerts.filter(a => a.id > (S.lastAlertSeen || 0)).length;
    if (S.firstState){ S.firstState = false; if (st.picks.some(p => !p.final)) setTab("picks"); }
    setFeed(st.feed);
    render(true);
  }catch(e){
    setFeed({ok:false, offline:true, error:"Can't reach the tracker. Is it still running on your computer?"});
  }
}

/* ---------- crests, flags and faces (ESPN's image CDN, sized down) ---------- */
const CDN = "https://a.espncdn.com";
function small(url, w, h){
  url = String(url || "");
  if (url.indexOf(CDN + "/i/") === 0 && /^\/i\/[\w\/.-]+$/.test(url.slice(CDN.length))) return CDN + "/combiner/i?img=" + url.slice(CDN.length) + "&w=" + w + "&h=" + (h || w);
  return /^https:\/\//.test(url) ? url : "";
}
function tint(hex){
  if (!/^[0-9a-f]{6}$/i.test(hex || "")) return "";
  const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16));
  const lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  const k = lum > 0.75 ? 0.3 : lum > 0.55 ? 0.55 : 0.85, bg = [20, 30, 51];
  return "rgb(" + c.map((v, i) => Math.round(v * k + bg[i] * (1 - k))).join(",") + ")";
}
function initials(name){
  const w = String(name || "").replace(/[^A-Za-zÀ-ɏ' -]/g, "").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "?";
  return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase();
}
const FACES = {nba:"nba", wnba:"wnba", nfl:"nfl", nhl:"nhl", atp:"tennis", wta:"tennis"};
function faceUrl(league, id, w){
  if (!/^\d+$/.test(String(id || ""))) return "";
  const f = FACES[league] || (String(league || "").includes(".") ? "soccer" : "");
  return f ? CDN + "/combiner/i?img=/i/headshots/" + f + "/players/full/" + id + ".png&w=" + (w || 128) + "&h=" + Math.round((w || 128) * 0.727) : "";
}
// If an image fails: try the fallback in data-alt once, then show the monogram underneath.
const NOIMG = 'onerror="var a=this.getAttribute(\'data-alt\');if(a){this.removeAttribute(\'data-alt\');this.src=a}else{var p=this.parentNode;p.classList.remove(\'pic\',\'flag\',\'img\');this.remove()}"';
// ESPN keeps a version of each crest drawn for dark backgrounds (a white Juventus J and so on).
function darkLogo(url){ return /\/i\/teamlogos\/(?!countries\/)[a-z0-9_.-]+\/500\//i.test(url || "") ? url.replace("/500/", "/500-dark/") : ""; }
/* ---------- photos for every player ---------- */
// ESPN has headshots for the NBA, WNBA, NFL, NHL, tennis and some soccer players. For everyone else the engine finds
// the photo on the player's Wikipedia page, once, and it's kept here. No photo to be had: his team's jersey and number.
// Kept a month (a week for players with none), so new photos get picked up.
const PHOTOS = (() => { const o = LS.get("photos-v1", {}), now = Date.now(); for (const k in o){ const v = o[k]; if (!v || !v.t || now - v.t > (v.u ? 30 : 7) * 864e5) delete o[k]; } return o; })();
// Photos that wouldn't load this time (offline, say): the jersey for now, try again next time.
const photoDead = {}, espnMiss = {};
const photoQ = [];
let photoBusy = false, photoPause = 0;
const sportOf = lg => lg === "afl" ? "aussie" : lg === "nrl" ? "league" : ["nbl", "nba", "wnba"].includes(lg) ? "basketball" : lg === "nfl" ? "football" :
  lg === "nhl" ? "hockey" : lg === "atp" || lg === "wta" ? "tennis" : String(lg || "").includes(".") ? "soccer" : "";
// {u: the picture, kind: "cut" for an ESPN cut-out or "pic" for a photo, fk: the key to fill in later, want: look it up}
function photoFor(league, id, w){
  if (!/^\d+$/.test(String(id || "")) || !league || league === "demo") return {u:""};
  if (FACES[league]) return {u:faceUrl(league, id, w), kind:"cut"};
  const k = league + ":" + id, v = PHOTOS[k];
  if (photoDead[k]) return {u:"", fk:k};
  if (v) return v.u ? {u:v.u, kind:"pic", page:v.p, fk:k} : {u:"", fk:k};
  if (String(league).includes(".") && !espnMiss[k]) return {u:faceUrl(league, id, w), kind:"cut", fk:k};
  return {u:"", fk:k, want:true};
}
function needPhoto(league, sport, id, name, first){
  const k = league + ":" + id;
  if (!name || !sport || !/^\d+$/.test(String(id || "")) || PHOTOS[k] !== undefined || Date.now() < photoPause) return;
  const at = photoQ.findIndex(q => q.k === k);
  if (at >= 0){ if (first && at > 0) photoQ.unshift(photoQ.splice(at, 1)[0]); return; }
  if (photoQ.length >= 150) return;
  const q = {k, league, sport, id:String(id), name};
  if (first) photoQ.unshift(q); else photoQ.push(q);
  if (!photoBusy) setTimeout(pumpPhotos, 60);
}
async function pumpPhotos(){
  if (photoBusy) return;
  photoBusy = true;
  try{
    while (photoQ.length){
      const q = photoQ.shift();
      if (PHOTOS[q.k] !== undefined) continue;
      let r;
      try { r = await api("/api/face?league=" + encodeURIComponent(q.league) + "&sport=" + encodeURIComponent(q.sport) + "&id=" + encodeURIComponent(q.id) + "&name=" + encodeURIComponent(q.name)); }
      catch(e){ photoQ.length = 0; photoPause = Date.now() + 60000; break; }
      if (!r || r.later){ photoQ.length = 0; photoPause = Date.now() + 5 * 60000; break; }
      PHOTOS[q.k] = {u:r.u || "", p:r.p || "", t:Date.now()};
      savePhotos();
      if (r.u) showPhoto(q.k);
    }
  } finally { photoBusy = false; }
}
function savePhotos(){ clearTimeout(savePhotos.t); savePhotos.t = setTimeout(() => LS.set("photos-v1", PHOTOS), 400); }
// A photo turned up: put it in every face waiting for it, and redraw the card if it's his.
function showPhoto(k){
  const v = PHOTOS[k];
  if (!v || !v.u) return;
  document.querySelectorAll('[data-fk="' + k + '"]').forEach(box => {
    if (box.querySelector("img")) return;
    const img = new Image();
    img.className = "pic"; img.alt = "";
    img.onload = () => box.classList.add("haspic");
    img.onerror = () => { img.remove(); photoDead[k] = true; };
    img.src = v.u;
    box.appendChild(img);
  });
  if (S.sheet && S.sheet.g && S.sheet.g.league + ":" + S.sheet.p.id === k) updateFormBox();
}
// A picture didn't load: ESPN had no soccer headshot (look on Wikipedia), or a Wikipedia photo has gone.
function faceErr(img){
  const box = img.parentNode, k = box && box.getAttribute("data-fk"), src = img.getAttribute("src");
  img.remove();
  if (box) box.classList.remove("haspic");
  if (!k) return;
  const v = PHOTOS[k];
  if (v && v.u && src === v.u){ photoDead[k] = true; return; }
  if (/espncdn\.com/.test(src || "")) espnMiss[k] = true;
  if (v === undefined){ const i = k.indexOf(":"); needPhoto(k.slice(0, i), img.getAttribute("data-sp"), k.slice(i + 1), img.getAttribute("data-nm") || ""); }
}
// The jersey: his team's colour, a singlet for basketball and footy, a shirt for the rest, his number on it.
const KIT = {
  shirt:"M14 6 9 8 3.5 14 8 19 11 16.8V35h18V16.8L32 19 36.5 14 31 8 26 6c-1 2.6-3.2 4-6 4s-5-1.4-6-4Z",
  singlet:"M13.5 5H16c.6 3.4 2 5 4 5s3.4-1.6 4-5h2.5c.2 4.5 1.8 7.5 4.5 9v21.5H9V14c2.7-1.5 4.3-4.5 4.5-9Z"
};
function kitColor(hex){
  if (!/^[0-9a-f]{6}$/i.test(hex || "")) return {fill:"#3a4d78", ink:"#fff"};
  const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16));
  const lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  const lift = lum < 0.12 ? 0.3 : 0;
  return {fill:"rgb(" + c.map(v => Math.round(v + (255 - v) * lift)).join(",") + ")", ink:lum > 0.62 ? "#0b1220" : "#fff"};
}
function jerseySvg(hex, label, sport, cls){
  const k = kitColor(hex), single = sport === "basketball" || sport === "aussie";
  const t = String(label == null ? "" : label).slice(0, 3), fs = t.length >= 3 ? 10.5 : 14;
  return '<svg class="jsy' + (cls ? " " + cls : "") + '" viewBox="0 0 40 40" aria-hidden="true"><path d="' + (single ? KIT.singlet : KIT.shirt) + '" fill="' + k.fill + '" stroke="rgba(255,255,255,.3)" stroke-width="1"/>' +
    '<text x="20" y="' + (single ? 27.5 : 27) + '" text-anchor="middle" font-size="' + fs + '" fill="' + k.ink + '">' + esc(t) + '</text></svg>';

// What goes inside a round face: the jersey (initials for tennis) with the photo over it once it loads.
function faceInner(league, sport, id, name, w, hex, label){

function filterGames(){

const isWin = p => p.stat === "HWIN" || p.stat === "AWIN";

// A line or handicap as a bookie writes it: More = the side giving the start, Less = the side getting it.
function capText(p){
  const g = p.game || {}, h = p.stat === "HCAP", a = g.home_name || g.home || "Home", b = g.away_name || g.away || "Away";
  return (p.side === "more" ? (h ? a : b) + " -" : (h ? b : a) + " +") + fmt(p.line) + ((p.sport || g.sport) === "tennis" ? " games" : "");
}
function pickChip(p){
  if (isCap(p) && !p.final && p.status !== "waiting" && p.line != null){
    const v = +p.value || 0, ok = p.side === "more" ? v > p.line : v < p.line;
    return '<span class="chip ' + (ok ? "hit" : "live") + '">' + (ok ? "Covering" : "Not covering") + '</span>';
  }
  if (p.stat === "DRAW" && !p.final && p.status !== "waiting"){
    const lvl = (+p.value || 0) > 0.5, ok = p.side === "more" ? lvl : !lvl;
    return '<span class="chip ' + (ok ? "hit" : "live") + '">' + (lvl ? "Level" : "Not level") + '</span>';
  }
  if (isWin(p) && !p.final && p.status !== "waiting"){
    const v = +p.value || 0, good = p.side === "more" ? v > 0 : v <= 0;
    const sets = n => n === 1 ? "a set" : fmt(n) + " sets";
    const txt = (p.sport || (p.game || {}).sport) === "tennis" ? (v > 0 ? "Up " + sets(v) : v < 0 ? "Down " + sets(-v) : "Sets level")
      : v > 0 ? "Winning by " + fmt(v) : v < 0 ? "Losing by " + fmt(-v) : "Level";
    return '<span class="chip ' + (good ? "hit" : "live") + '">' + txt + '</span>';
  }
  const map = {hit:p.mono ? "HIT" : "Over", bust:p.mono ? "BUST" : "Over", won:"WON", lost:"LOST", push:"PUSH", void:"VOID", done:"FINAL", waiting:"Not started", tracking:"Tracking"};
  if (p.status === "live"){
    if (p.yesno) return '<span class="chip live">' + (p.side === "more" ? "Not yet" : "So far so good") + '</span>';
    const need = p.side === "more" ? Math.floor(p.line) + 1 - p.value : Math.ceil(p.line) - 1 - p.value;

function shortName(p){ return p.short || p.name || ""; }

      : '<div class="spin"></div><div class="empty" style="padding-top:0">Checking today\'s games, prices and recent form.<br>The first look can take up to a minute.</div>');
    const b = $("lretry"); if (b) b.onclick = () => loadLadder(true);
    bindSegs(el, "ps", setPlaysSeg); bindLadderCard(); bindPlayButtons(el);

    return;
  }
  const r = L.rules;
  let h = top + card + '<div class="gamehead" style="margin-top:6px"><span class="t" style="font-size:18px">' + (FEAT().slips ? "Best plays" : "$2 ladder") + '</span><button class="btn small" id="lref"' + (S.ladderLoading ? " disabled" : "") + '>' + (S.ladderLoading ? "Checking..." : "Refresh") + '</button></div>';
  h += '<div class="small muted" style="margin:-4px 2px 12px">Games starting in the next ' + r.hours + ' hours · checked ' + esc(clockText(L.updated)) + '</div>';
  if (S.ladderErr) h += '<div class="card err">' + esc(S.ladderErr) + '</div>';
  if (L.best) h += playCard(L.best, "Best play", "best");
  if (L.best_double && !samePlay(L.best_double, L.best)) h += playCard(L.best_double, "Best $2 double", "dbl");
  if (!L.best && !L.best_double){
    h += '<div class="empty"><b>Nothing fits your rules right now</b>' + (L.games_in_window ? "None of the " + L.scanned + " games with prices has a play at " + money(r.single_min) + " to " + money(r.single_max) + " with a " + r.single_prob + "%+ chance, or a double up to " + money(r.double_max) + "." : "No games with prices start in the next " + r.hours + " hours.") + '</div>';
  }
  if (L.steps && L.steps.length > 1) h += '<h2>Steps through the day</h2><div class="card">' + stepsHtml(L) + '</div>';
  const singles = (L.singles || []).filter(p => !samePlay(p, L.best)).slice(0, 7);
  const doubles = (L.doubles || []).filter(p => !samePlay(p, L.best) && !samePlay(p, L.best_double)).slice(0, 5);
  if (singles.length) h += '<h2>Other singles</h2>' + singles.map((p, i) => miniPlay(p, "s" + i)).join("");
  if (doubles.length) h += '<h2>Other doubles</h2>' + doubles.map((p, i) => miniPlay(p, "d" + i)).join("");
  h += '<div class="card small muted" style="margin-top:14px">Your rules: singles ' + money(r.single_min) + ' to ' + money(r.single_max) + ' at ' + r.single_prob + '%+, doubles from two games up to ' + money(r.double_max) + ' at ' + r.double_prob + '%+.' +
    '<div style="margin-top:8px">Prices are ' + esc(L.provider) + ' via ESPN, so your bookie\'s will differ a little. Check the price is still in your range before you bet. The chance blends the price (with the margin taken out) and how often the player has cleared the line lately.</div>' +
    ((L.skipped || []).length ? '<div style="margin-top:8px">Left out: ' + esc(L.skipped.join(", ")) + ' (ESPN has no prices for it).</div>' : '') +
    '<button class="btn small" id="lrules" style="margin-top:10px">Change rules</button></div>';
  el.innerHTML = h;
  $("lref").onclick = () => loadLadder(true);
  $("lrules").onclick = () => { setTab("settings"); setTimeout(() => { const t = $("rulesh"); if (t) t.scrollIntoView({block:"start"}); }, 50); };
  const bi = $("lbal"); if (bi) bi.onchange = () => { const v = parseFloat(bi.value); if (v >= 1) LS.set("ladderBal", +v.toFixed(2)); renderLadder(); };
  el.querySelectorAll("[data-lx]").forEach(b => b.onclick = () => { S.lopen[b.dataset.lx] = !S.lopen[b.dataset.lx]; renderLadder(); });
  bindSegs(el, "ps", setPlaysSeg); bindLadderCard(); bindPlayButtons(el);
}
async function trackPlay(play, btn){
  if (!play) return;
  btn.disabled = true; btn.textContent = "Adding...";
  const LS2 = S.state && S.state.ladder;
  if (FEAT().slips && LS2 && !LS2.slip){
    try{
      const r = await api("/api/ladder/track", {play});
      await loadState();
      toast({kind:"event", title:"Ladder step " + (r.slip.step || 1) + " is on", body:money(r.slip.stake) + " @ " + (+r.slip.price).toFixed(2) + " returns " + money(r.slip.stake * r.slip.price) + ". Place the same bet with your bookie."});
      renderLadder();
    }catch(e){ btn.disabled = false; btn.textContent = "Couldn't add: " + e.message; }
    return;
  }
  let added = 0;
  try{
    for (const l of play.legs){
      if (legTracked(l)) continue;
      await api("/api/picks", {game_id:l.game_id, athlete_id:l.athlete_id, name:l.name, team:l.team, stat:l.stat, side:l.side,
                               line:l.line, odds:l.price, source:"ladder", alerts:(l.stat === "HWIN" || l.stat === "AWIN") ? "key" : "all"});
      added++;
    }
    await loadState();
    toast({kind:"event", title:"Tracking your ladder play", body: added + (added === 1 ? " leg" : " legs") + " added · " + money(play.price)});
    setTab("picks");
  }catch(e){ btn.disabled = false; btn.textContent = "Couldn't add: " + e.message; }
}

/* ---------- v4 helpers ---------- */
const smoney = v => (v < 0 ? "-$" : "+$") + Math.abs(+v || 0).toFixed(2);
const HOOK = () => !!(S.state && S.state.settings && S.state.settings.discord_webhook);
function segs(list, cur, attr){
  return '<div class="segs">' + list.map(([k, l, n]) => '<button data-' + attr + '="' + k + '" class="' + (cur === k ? "on" : "") + '">' + esc(l) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>').join("") + '</div>';
}
function bindSegs(el, attr, fn){
  el.querySelectorAll("[data-" + attr + "]").forEach(b => b.onclick = () => fn(b.dataset[attr]));
  el.querySelectorAll(".segs.many").forEach(row => {
    const on = row.querySelector("button.on");
    if (on && row.scrollWidth > row.clientWidth) row.scrollLeft = Math.max(0, on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2);
  });

function injBadge(st){
  if (!st) return "";
  return ' <span class="badge ' + (/out|reserve|suspend/i.test(st) ? "inj" : "q") + '">' + esc(st) + '</span>';

async function postDiscord(body, btn){
  const t = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = "Posting..."; }
  let ok = false;
  try{
    const r = await api("/api/discord", body);
    ok = !!r.ok;
    if (!ok) toast({kind:"bust", title:"Couldn't post to Discord", body:r.error || ""});
  }catch(e){ toast({kind:"bust", title:"Couldn't post to Discord", body:e.message}); }
  if (btn){ btn.textContent = ok ? "Posted" : "Didn't post"; setTimeout(() => { btn.disabled = false; btn.textContent = t; }, 2500); }
  else if (ok) toast({kind:"event", title:"Posted to Discord", body:""});

// The engine's pace line, minus what the chip already says, with the chance set big on the right.
function paceHtml(p){
  const pc = p.pace;
  if (!pc || !pc.text || p.final) return "";
  const c = +pc.chance, cls = c >= 0.6 ? "good" : c >= 0.3 ? "mid" : "bad";
  const raw = String(pc.text);
  if (/^(Landed|Gone over)$/.test(raw)) return "";
  const parts = /^ESPN gives it/.test(raw) ? ["ESPN's win chance"]
    : raw.replace(/\s*·?\s*\d+% chance$/, "").split(" · ").filter(t => t && !/^needs |to spare$|^next one busts it$/.test(t));
  return '<div class="pace ' + cls + '">' + parts.map(t => '<span>' + esc(t) + '</span>').join("") + (pc.chance != null ? '<span class="pc">' + (c >= 1 ? 100 : c <= 0 ? 0 : Math.max(1, Math.min(99, Math.round(c * 100)))) + '%<small>chance</small></span>' : '') + '</div>';
}
function moveHtml(p){
  if (!p.odds || !p.odds_now || p.status !== "waiting") return "";
  const d = (p.odds_now - p.odds) / p.odds;
  if (Math.abs(d) < 0.03) return "";
  return '<span style="color:' + (d < 0 ? "var(--green)" : "var(--red)") + '">Now ' + money(p.odds_now) + (d < 0 ? ", in from " : ", out from ") + money(p.odds) + '</span>';
}

/* ---------- picks tab: picks, slips, results ---------- */

}

function updateSlipBar(){
  const bar = $("slipbar");

  bar.hidden = !on;

  const ps = S.state.picks.filter(p => S.sel[p.id] && !p.final);
